// =============== EVENTOS / CAMPEONATOS ===============
const STAGE_DEFS = [
  // Cada etapa alimenta a próxima em cadeia sequencial (single-elimination)
  { key:'openGroup',   label:'Open Group',      type:'group', advance:64 },   // 120 jogadores  -> 64 classificam
  { key:'closedGroup', label:'Closed Group',    type:'group', advance:32 },   //  64 jogadores  -> 32 classificam
  { key:'qualifier',   label:'Qualificatórias', type:'group', advance:32 },   //  32 jogadores  -> 32 avançam (seeding)
  { key:'r32',         label:'16 avos',         type:'elim',  slots:32 },     //  32 times (16 partidas) -> 16 vencedores
  { key:'r16',         label:'8 avos',          type:'elim',  slots:16 },     //  16 times ( 8 partidas) ->  8 vencedores
  { key:'quarters',    label:'Quartas de Final',type:'elim',  slots:8  },     //   8 times ( 4 partidas) ->  4 vencedores
  { key:'semis',       label:'Semifinal',       type:'elim',  slots:4  },     //   4 times ( 2 partidas) ->  2 finalistas
  { key:'final',       label:'Final',           type:'elim',  slots:2  }      //   2 times ( 1 partida ) ->  campeão
];

function newEventDraft(){
  return {
    name:'', sigla:'', description:'', reward:'', startDate:'',
    teamsRaw:'',
    format: { openGroup:false, closedGroup:false, qualifier:false, r32:false, r16:false, quarters:true, semis:true, final:true }
  };
}

function parseTeamsList(raw){
  return (raw||'').split(/\n|,|;/).map(s => s.trim()).filter(Boolean).map((n,i) => ({
    id: 't_' + Date.now().toString(36) + '_' + i,
    name: n,
    seed: i+1
  }));
}

function buildStagesFromFormat(format, teams){
  const active = STAGE_DEFS.filter(sd => format[sd.key]);
  if(active.length === 0) return [];
  const stages = [];
  let currentTeams = teams.map(t => t.id);
  active.forEach((sd, idx) => {
    const stage = {
      key: sd.key, label: sd.label, type: sd.type,
      teams: currentTeams.slice(),
      matches: [],
      advanceCount: null,
      completed: false
    };
    if(sd.type === 'group'){
      // round-robin: each pair plays once
      const ts = currentTeams.slice();
      for(let i=0; i<ts.length; i++){
        for(let j=i+1; j<ts.length; j++){
          stage.matches.push({
            id:'gm_'+idx+'_'+i+'_'+j, a: ts[i], b: ts[j],
            scoreA:null, scoreB:null, winner:null
          });
        }
      }
      // default advance = min(next stage slots, half of teams)
      const next = active[idx+1];
      stage.advanceCount = next && next.slots ? Math.min(next.slots, ts.length) : Math.max(1, Math.floor(ts.length/2));
    } else {
      // elim: pair 1v N, 2v N-1, ...
      const ts = currentTeams.slice();
      // pad with BYE if odd
      while(ts.length % 2 !== 0) ts.push('__BYE__');
      const half = ts.length / 2;
      for(let i=0; i<half; i++){
        stage.matches.push({
          id:'em_'+idx+'_'+i, a: ts[i], b: ts[ts.length-1-i],
          scoreA:null, scoreB:null, winner: null
        });
      }
    }
    stages.push(stage);
    // For next stage seeding, we pre-fill with placeholders (TBD) — actual advancement happens via advanceStage()
    currentTeams = new Array( sd.type==='group' ? stage.advanceCount : Math.max(1, Math.floor(stage.matches.length)) ).fill('__TBD__');
  });
  return stages;
}

function teamName(ev, tid){
  if(tid === '__BYE__') return '(bye)';
  if(tid === '__TBD__' || !tid) return 'A definir';
  const t = ev.teams.find(x => x.id === tid);
  return t ? t.name : tid;
}
function teamSeed(ev, tid){
  const t = ev.teams.find(x => x.id === tid);
  return t ? t.seed : '';
}

// ---- modo automático: o sistema decide o vencedor só pelos pontos digitados ----
function evAutoOn(ev){ return !ev || ev.autoWinner !== false; }   // ligado por padrão
function autoDecideMatch(stage, m){
  // devolve true se o vencedor mudou
  const before = m.winner;
  if(m.a==='__BYE__' || m.b==='__BYE__' || m.a==='__TBD__' || m.b==='__TBD__') return false;
  if(m.scoreA == null || m.scoreB == null || isNaN(m.scoreA) || isNaN(m.scoreB)){ m.winner = null; }
  else if(m.scoreA > m.scoreB) m.winner = 'a';
  else if(m.scoreB > m.scoreA) m.winner = 'b';
  else m.winner = stage.type === 'group' ? 'd' : null;   // empate: pontos da fase de grupos aceitam empate; mata-mata precisa de desempate
  return before !== m.winner;
}

// ---- simulação: o sistema define os pontos que faltam; pontos já digitados são mantidos e somados ----
function simulateStage(ev, stage){
  const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
  let simulated = 0, kept = 0;
  stage.matches.forEach(m => {
    if(m.a==='__BYE__' || m.b==='__BYE__' || m.a==='__TBD__' || m.b==='__TBD__') return;
    const hasA = m.scoreA != null && !isNaN(m.scoreA), hasB = m.scoreB != null && !isNaN(m.scoreB);
    if(hasA && hasB && m.scoreA !== m.scoreB){ autoDecideMatch(stage, m); kept++; return; }   // placar completo digitado: só mantém
    if(hasA && hasB && stage.type === 'group'){ m.winner = 'd'; kept++; return; }              // empate válido na fase de grupos
    // quem vence: manual (se já escolhido) ou sorteio ponderado pelo seed (seed menor = favorito)
    let w = (m.winner === 'a' || m.winner === 'b') ? m.winner : null;
    if(!w){
      const sa = Number(teamSeed(ev, m.a)) || 0, sb = Number(teamSeed(ev, m.b)) || 0;
      const pA = (sa && sb) ? sb/(sa+sb) : 0.5;
      w = Math.random() < pA ? 'a' : 'b';
      if(hasA && hasB){ /* empate no mata-mata: só desempata */ }
      else if(hasA && m.scoreA === 0) w = 'b';
      else if(hasB && m.scoreB === 0) w = 'a';
    }
    if(!(hasA && hasB)){
      // completa só o lado que falta, respeitando os pontos já digitados
      const knownA = hasA ? m.scoreA : null, knownB = hasB ? m.scoreB : null;
      if(w === 'a'){
        if(knownA != null){ m.scoreB = knownB != null ? knownB : rnd(0, Math.max(knownA-1,0)); }
        else { m.scoreB = knownB != null ? knownB : rnd(3,11); m.scoreA = knownB != null ? knownB + rnd(1,5) : 13; }
      } else {
        if(knownB != null){ m.scoreA = knownA != null ? knownA : rnd(0, Math.max(knownB-1,0)); }
        else { m.scoreA = knownA != null ? knownA : rnd(3,11); m.scoreB = knownA != null ? knownA + rnd(1,5) : 13; }
      }
      if(m.scoreA === m.scoreB){ if(w==='a') m.scoreA++; else m.scoreB++; }
      if(hasA || hasB) kept++;
    }
    m.winner = w; simulated++;
  });
  return {simulated, kept};
}

function stageIsComplete(stage){
  if(stage.type === 'elim'){
    return stage.matches.every(m => m.winner || m.a==='__BYE__' || m.b==='__BYE__');
  }
  return stage.matches.every(m => m.winner);
}

function computeGroupStandings(stage, ev){
  const stats = {};
  stage.teams.forEach(tid => { stats[tid] = { tid, name: teamName(ev,tid), w:0, l:0, d:0, gf:0, ga:0, played:0 }; });
  stage.matches.forEach(m => {
    if(m.winner){
      stats[m.a].played++; stats[m.b].played++;
      stats[m.a].gf += m.scoreA||0; stats[m.a].ga += m.scoreB||0;
      stats[m.b].gf += m.scoreB||0; stats[m.b].ga += m.scoreA||0;
      if(m.winner === 'a'){ stats[m.a].w++; stats[m.b].l++; }
      else if(m.winner === 'b'){ stats[m.b].w++; stats[m.a].l++; }
      else { stats[m.a].d++; stats[m.b].d++; }
    }
  });
  return Object.values(stats).sort((x,y) => (y.w - x.w) || ((y.gf-y.ga)-(x.gf-x.ga)) || (y.gf - x.gf));
}

function advanceStage(ev, stageIdx){
  const stage = ev.stages[stageIdx];
  if(!stage || !stageIsComplete(stage)) return;
  const next = ev.stages[stageIdx+1];
  stage.completed = true;
  let advanced = [];
  if(stage.type === 'group'){
    const standings = computeGroupStandings(stage, ev);
    advanced = standings.slice(0, stage.advanceCount || standings.length).map(s => s.tid);
  } else {
    advanced = stage.matches.map(m => {
      if(m.a === '__BYE__') return m.b;
      if(m.b === '__BYE__') return m.a;
      return m.winner === 'a' ? m.a : m.b;
    });
  }
  if(next){
    if(next.type === 'elim'){
      let ts = advanced.slice();
      while(ts.length % 2 !== 0) ts.push('__BYE__');
      next.teams = ts;
      next.matches = [];
      const half = ts.length/2;
      for(let i=0; i<half; i++){
        next.matches.push({
          id:'em_a'+stageIdx+'_'+i, a: ts[i], b: ts[ts.length-1-i],
          scoreA:null, scoreB:null, winner:null
        });
      }
    } else {
      next.teams = advanced.slice();
      next.matches = [];
      for(let i=0; i<advanced.length; i++){
        for(let j=i+1; j<advanced.length; j++){
          next.matches.push({ id:'gm_a'+stageIdx+'_'+i+'_'+j, a:advanced[i], b:advanced[j], scoreA:null, scoreB:null, winner:null });
        }
      }
    }
  } else {
    // finished the whole thing
    if(stage.type === 'elim' && stage.key === 'final'){
      const finalM = stage.matches[0];
      if(finalM && finalM.winner){
        ev.winner = finalM.winner === 'a' ? finalM.a : finalM.b;
      }
    }
    ev.status = 'finished';
  }
}

function eventStatusLabel(ev){
  if(ev.status === 'finished') return 'Encerrado';
  if(ev.status === 'live') return 'Ao vivo';
  return 'Em breve';
}

function eventsSortedActive(){
  const order = { live:0, upcoming:1, finished:2 };
  return events.slice().sort((a,b) => (order[a.status]||9) - (order[b.status]||9) || (b.createdAt||0) - (a.createdAt||0));
}

      </div>
      ${list.length === 0
        ? '<p class="empty-note">Nenhum campeonato criado ainda. '+ (isMod ? 'Clique em "+ Novo campeonato" pra começar.' : 'Fique atento — a staff vai anunciar em breve!') +'</p>'
        : `<div class="events-grid">${cards}</div>`
      }
    </div>
  `;
}

function eventDetailHTML(ev){
  const isMod = userProfile && userProfile.role === 'moderator';
  const stages = ev.stages || [];
  if(eventDetailStage >= stages.length) eventDetailStage = 0;
  const stage = stages[eventDetailStage];
  const stageNav = stages.map((s,i) => `
    <button class="st-btn ${i===eventDetailStage?'active':''} ${s.completed?'done':''}" data-stage-idx="${i}">${s.label}</button>
  `).join('');
  let stageBody = '<p class="empty-note">Sem fases configuradas.</p>';
  if(stage){
    if(stage.type === 'elim'){
      stageBody = `<div class="bracket"><div class="bracket-round"><h4>${stage.label}</h4>${stage.matches.map(m => renderElimMatch(ev, stage, m, isMod)).join('')}</div></div>`;
    } else {
      const standings = computeGroupStandings(stage, ev);
      const advance = stage.advanceCount || 0;
      stageBody = `
        <div class="group-standings">
          <div class="group-box">
            <h4>Classificação — top ${advance} avança</h4>
            <div class="group-table-wrap">
              <table class="group-table"><thead><tr><th>#</th><th>Time</th><th>V</th><th>E</th><th>D</th><th>Saldo</th></tr></thead>
                <tbody>
                  ${standings.map((s,i) => `<tr class="${i<advance?'qualified':''}"><td><span class="pos">${i+1}</span></td><td>${s.name}</td><td>${s.w}</td><td>${s.d}</td><td>${s.l}</td><td>${s.gf-s.ga>=0?'+':''}${s.gf-s.ga}</td></tr>`).join('')}
                </tbody>
              </table>
            </div>
          </div>
          <div class="group-box">
            <h4>Partidas (${stage.matches.filter(m=>m.winner).length}/${stage.matches.length})</h4>
            <div class="group-matches">
              ${stage.matches.map(m => renderGroupMatch(ev, stage, m, isMod)).join('')}
            </div>
          </div>
        </div>
      `;
    }
  }

  const podium = (ev.status === 'finished' && stages.length) ? renderPodium(ev) : '';
  const stageComplete = stage && stageIsComplete(stage);
  const isLastStage = stage && eventDetailStage === stages.length - 1;

  return `
    <div class="event-detail-hero">
      <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:14px; flex-wrap:wrap;">
        <div>
          ${ev.sigla ? `<div class="ev-sigla" style="display:inline-block; margin-bottom:10px;">${ev.sigla}</div>` : ''}
          <h1>${ev.name}</h1>
          <div class="hero-sub">${ev.description || 'Campeonato oficial BRCS2.'}</div>
          <div class="hero-meta">
            <span class="ev-status ${ev.status}">${eventStatusLabel(ev)}</span>
            <span>👥 <b>${(ev.teams||[]).length}</b> times</span>
            <span>🎯 <b>${stages.length}</b> fases</span>
            ${ev.startDate ? `<span>📅 <b>${ev.startDate}</b></span>` : ''}
            ${ev.reward ? `<span>🏆 ${ev.reward}</span>` : ''}
            ${ev.winner ? `<span>👑 Campeão: <b>${teamName(ev, ev.winner)}</b></span>` : ''}
          </div>
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button class="secondary" id="btnBackEvents" type="button">← Voltar</button>
          ${isMod ? `<button class="danger" id="btnDeleteEvent" data-event-id="${ev.id}" type="button">Excluir</button>` : ''}
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="stage-nav">${stageNav}</div>
      ${isMod ? `<div class="auto-bar"><label class="auto-toggle"><input type="checkbox" id="evAutoToggle" ${evAutoOn(ev) ? 'checked' : ''}><span>⚡ Deixar o sistema definir quem pontuou — só digite os pontos de cada time</span></label><span style="display:flex;gap:8px;flex-wrap:wrap">${evAutoOn(ev) && stage ? '<button class="secondary small" id="btnAutoAll" type="button">Calcular todos pelos pontos</button>' : ''}${stage && !stage.completed ? '<button class="primary small" id="btnSimAll" type="button">🎲 Sistema calcula todos os times</button>' : ''}</span></div>` : ''}
      ${stageBody}
      ${isMod && stage && stageComplete && !isLastStage ? `<div style="margin-top:16px;"><button class="primary" id="btnAdvanceStage" data-stage-idx="${eventDetailStage}">Avançar para ${stages[eventDetailStage+1].label} →</button></div>` : ''}
      ${isMod && stage && stageComplete && isLastStage && ev.status !== 'finished' ? `<div style="margin-top:16px;"><button class="primary" id="btnFinishEvent">Encerrar campeonato 🏆</button></div>` : ''}
    </div>
    ${podium}
  `;
}

function renderElimMatch(ev, stage, m, isMod){
  const winnerA = m.winner === 'a';
  const winnerB = m.winner === 'b';
  const decided = m.winner || m.a==='__BYE__' || m.b==='__BYE__';
  return `
    <div class="bracket-match" data-match-id="${m.id}">
      <div class="bm-row ${winnerA?'winner':(decided?'loser':'')}">
        <div class="bm-team"><span class="seed">${teamSeed(ev,m.a)||''}</span><span class="nm">${teamName(ev,m.a)}</span></div>
        ${isMod && m.a!=='__BYE__' && m.b!=='__BYE__' && m.a!=='__TBD__' && m.b!=='__TBD__'
          ? `<input class="score-inp" data-mid="${m.id}" data-side="a" type="number" min="0" value="${m.scoreA??''}" placeholder="0">`
          : `<div class="bm-score">${m.scoreA??'-'}</div>`}
      </div>
      <div class="bm-row ${winnerB?'winner':(decided?'loser':'')}">
        <div class="bm-team"><span class="seed">${teamSeed(ev,m.b)||''}</span><span class="nm">${teamName(ev,m.b)}</span></div>
        ${isMod && m.a!=='__BYE__' && m.b!=='__BYE__' && m.a!=='__TBD__' && m.b!=='__TBD__'
          ? `<input class="score-inp" data-mid="${m.id}" data-side="b" type="number" min="0" value="${m.scoreB??''}" placeholder="0">`
          : `<div class="bm-score">${m.scoreB??'-'}</div>`}
      </div>
      ${isMod && m.a!=='__BYE__' && m.b!=='__BYE__' && m.a!=='__TBD__' && m.b!=='__TBD__' ? (() => {
        const auto = evAutoOn(ev), tie = m.scoreA != null && m.scoreA === m.scoreB;
        const manual = !auto || tie;
        return `
        <div class="bm-actions">
          ${auto && !tie ? `<span class="auto-hint">⚡ ${m.winner ? 'Definido pelos pontos' : 'Digite os pontos dos dois times'}</span>` : ''}
          ${auto && tie ? `<span class="auto-hint warn">Empate — escolha quem avança:</span>` : ''}
          ${manual ? `<button class="ok small" data-set-winner="${m.id}" data-side="a">Vence A</button>
          <button class="ok small" data-set-winner="${m.id}" data-side="b">Vence B</button>` : ''}
          ${m.winner ? `<button class="secondary small" data-clear-winner="${m.id}">Limpar</button>` : ''}
        </div>`; })() : ''}
    </div>
  `;
}

function renderGroupMatch(ev, stage, m, isMod){
  return `
    <div class="gm-row" data-match-id="${m.id}">
      <div class="gm-teams">
        <span class="tm">${teamName(ev,m.a)}</span>
        <span class="vs">vs</span>
        <span class="tm">${teamName(ev,m.b)}</span>
        ${(!isMod && (m.scoreA!=null || m.scoreB!=null)) ? `<span class="sc">${m.scoreA??'-'} × ${m.scoreB??'-'}</span>` : ''}
      </div>
      ${isMod ? `
        <div class="gm-controls">
          <input class="score-inp" data-mid="${m.id}" data-side="a" type="number" min="0" value="${m.scoreA??''}" placeholder="A">
          <span class="mid">×</span>
          <input class="score-inp" data-mid="${m.id}" data-side="b" type="number" min="0" value="${m.scoreB??''}" placeholder="B">
          ${evAutoOn(ev)
            ? `<span class="auto-hint">${m.winner ? (m.winner==='d' ? '⚡ Empate' : '⚡ Vence ' + (m.winner==='a' ? 'A' : 'B')) : '⚡ automático'}</span>`
            : `<button class="ok small" data-set-winner="${m.id}" data-side="a">A</button>
          <button class="ok small" data-set-winner="${m.id}" data-side="b">B</button>
          <button class="secondary small" data-set-winner="${m.id}" data-side="d">Empate</button>`}
        </div>
      ` : ''}
    </div>
  `;
}

function renderPodium(ev){
  const finalStage = ev.stages[ev.stages.length-1];
  if(!finalStage || finalStage.type !== 'elim' || !finalStage.matches[0]) return '';
  const fm = finalStage.matches[0];
  const first = fm.winner === 'a' ? fm.a : fm.b;
  const second = fm.winner === 'a' ? fm.b : fm.a;
  // third: from semis stage if exists
  let third = null;
  const semis = ev.stages.find(s => s.key === 'semis');
  if(semis){
    const losers = semis.matches.map(m => m.winner === 'a' ? m.b : m.a).filter(t => t !== first && t !== second);
    third = losers[0];
  }
  return `
    <div class="panel accent-blue">
      <h2>Pódio 🏆</h2>
      <div class="podium">
        <div class="pd second"><div class="pos">2º</div><div class="nm">${teamName(ev, second)}</div></div>
        <div class="pd first"><div class="pos">1º</div><div class="nm">${teamName(ev, first)}</div></div>
        <div class="pd third"><div class="pos">3º</div><div class="nm">${third ? teamName(ev, third) : '—'}</div></div>
      </div>
    </div>
  `;
}

  eventModalOpen = true;
  eventModalDraft = newEventDraft();
  renderTab();
}
function closeEventModal(){
  eventModalOpen = false;
  eventModalDraft = null;
  renderTab();
}

async function saveNewEvent(){
  const d = eventModalDraft;
  d.name = document.getElementById('ev_name').value.trim();
  d.sigla = document.getElementById('ev_sigla').value.trim().toUpperCase();
  d.description = document.getElementById('ev_desc').value.trim();
  d.reward = document.getElementById('ev_reward').value.trim();
  d.startDate = document.getElementById('ev_start').value;
  d.teamsRaw = document.getElementById('ev_teams').value;
  if(!d.name){ alert('Informe o nome do campeonato.'); return; }
  const teams = parseTeamsList(d.teamsRaw);
  if(teams.length < 2){ alert('Informe pelo menos 2 times.'); return; }
  const anyStage = Object.values(d.format).some(Boolean);
  if(!anyStage){ alert('Selecione ao menos uma fase.'); return; }
  const ev = {
    id: 'ev_' + Date.now().toString(36) + '_' + Math.floor(Math.random()*1000),
    name: d.name, sigla: d.sigla, description: d.description, reward: d.reward,
    startDate: d.startDate, teams, format: d.format,
    stages: buildStagesFromFormat(d.format, teams),
    status: 'upcoming', createdBy: userProfile.playerName, createdAt: Date.now(), winner: null
  };
  events.push(ev);
  await saveShared('brcsgo:events', events);
  showToast('Campeonato "'+ev.name+'" criado!');
  closeEventModal();
  selectedEventId = ev.id;
  eventDetailStage = 0;
  markEventSeen(ev.id);
  renderTab();
}

function attachEventosEvents(){
  // event banner (visible in any tab render since attachTabEvents runs each render)
  document.querySelectorAll('[data-goto-event]').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.dataset.gotoEvent;
      selectedEventId = id; activeTab = 'eventos'; eventDetailStage = 0; markEventSeen(id); render();
    });
  });
  if(activeTab !== 'eventos') return;

  const btnCreate = document.getElementById('btnCreateEvent');
  if(btnCreate) btnCreate.addEventListener('click', openEventModal);

  document.querySelectorAll('.event-card[data-event-id]').forEach(card => {
    card.addEventListener('click', () => {
      selectedEventId = card.dataset.eventId;
      eventDetailStage = 0;
      markEventSeen(selectedEventId);
      renderTab();
    });
  });

  const back = document.getElementById('btnBackEvents');
  if(back) back.addEventListener('click', () => { selectedEventId = null; renderTab(); });

  document.querySelectorAll('[data-stage-idx]').forEach(btn => {
    if(btn.classList.contains('st-btn')){
      btn.addEventListener('click', () => { eventDetailStage = parseInt(btn.dataset.stageIdx); renderTab(); });
    }
  });

  const adv = document.getElementById('btnAdvanceStage');
  if(adv) adv.addEventListener('click', async () => {
    const ev = events.find(e => e.id === selectedEventId); if(!ev) return;
    if(ev.status === 'upcoming') ev.status = 'live';
    advanceStage(ev, parseInt(adv.dataset.stageIdx));
    eventDetailStage++;
    await saveShared('brcsgo:events', events);
    showToast('Fase avançada!');
    renderTab();
  });

  const fin = document.getElementById('btnFinishEvent');
  if(fin) fin.addEventListener('click', async () => {
    const ev = events.find(e => e.id === selectedEventId); if(!ev) return;
    advanceStage(ev, ev.stages.length - 1);
    await saveShared('brcsgo:events', events);
    showToast('Campeonato encerrado!');
    renderTab();
  });

  const del = document.getElementById('btnDeleteEvent');
  if(del) del.addEventListener('click', async () => {
    if(!confirm('Excluir este campeonato? Não dá pra desfazer.')) return;
    events = events.filter(e => e.id !== del.dataset.eventId);
    selectedEventId = null;
    await saveShared('brcsgo:events', events);
    showToast('Campeonato excluído.');
    renderTab();
  });

  // score inputs
  document.querySelectorAll('input.score-inp').forEach(inp => {
    inp.addEventListener('change', async () => {
      const ev = events.find(e => e.id === selectedEventId); if(!ev) return;
      const stage = ev.stages[eventDetailStage]; if(!stage) return;
      const m = stage.matches.find(x => x.id === inp.dataset.mid); if(!m) return;
      const v = inp.value === '' ? null : parseInt(inp.value);
      if(inp.dataset.side === 'a') m.scoreA = v; else m.scoreB = v;
      let changed = false;
      if(evAutoOn(ev)){
        changed = autoDecideMatch(stage, m);
        if(m.winner && ev.status === 'upcoming') ev.status = 'live';
        if(m.scoreA != null && m.scoreA === m.scoreB && stage.type !== 'group') showToast('Empate no mata-mata — escolha quem avança.');
      }
      await saveShared('brcsgo:events', events);
      if(changed || (evAutoOn(ev) && stage.type !== 'group' && m.scoreA != null && m.scoreA === m.scoreB)) renderTab();   // só redesenha quando algo mudou (não tira o foco à toa)
    });
  });

  // modo automático: ligar/desligar e calcular tudo
  const autoTgl = document.getElementById('evAutoToggle');
  if(autoTgl) autoTgl.addEventListener('change', async () => {
    const ev = events.find(e => e.id === selectedEventId); if(!ev) return;
    ev.autoWinner = autoTgl.checked;
    await saveShared('brcsgo:events', events);
    renderTab();
  });
  const autoAll = document.getElementById('btnAutoAll');
  if(autoAll) autoAll.addEventListener('click', async () => {
    const ev = events.find(e => e.id === selectedEventId); if(!ev) return;
    const stage = ev.stages[eventDetailStage]; if(!stage) return;
    let n = 0, ties = 0;
    stage.matches.forEach(m => {
      if(m.scoreA == null || m.scoreB == null) return;
      if(m.winner && stage.type === 'elim' && m.scoreA === m.scoreB) return;   // desempate manual já feito
      autoDecideMatch(stage, m); if(m.winner) n++; else ties++;
    });
    if(n && ev.status === 'upcoming') ev.status = 'live';
    await saveShared('brcsgo:events', events);
    showToast(n + ' partida(s) definida(s) pelos pontos' + (ties ? ' · ' + ties + ' empate(s) no mata-mata para desempatar' : '') + '.');
    renderTab();
  });

  const simAll = document.getElementById('btnSimAll');
  if(simAll) simAll.addEventListener('click', async () => {
    const ev = events.find(e => e.id === selectedEventId); if(!ev) return;
    const stage = ev.stages[eventDetailStage]; if(!stage) return;
    if(!confirm('O sistema vai definir os pontos de todas as partidas desta fase que ainda não têm placar. Os pontos já digitados são mantidos. Continuar?')) return;
    const r = simulateStage(ev, stage);
    if(ev.status === 'upcoming') ev.status = 'live';
    await saveShared('brcsgo:events', events);
    showToast(r.simulated + ' partida(s) calculada(s) pelo sistema' + (r.kept ? ' · ' + r.kept + ' com pontos já digitados mantidos' : '') + '.');
    renderTab();
  });

  // set-winner buttons
  document.querySelectorAll('[data-set-winner]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const ev = events.find(e => e.id === selectedEventId); if(!ev) return;
      const stage = ev.stages[eventDetailStage]; if(!stage) return;
      const m = stage.matches.find(x => x.id === btn.dataset.setWinner); if(!m) return;
      m.winner = btn.dataset.side; // 'a', 'b', or 'd'
      if(ev.status === 'upcoming') ev.status = 'live';
      await saveShared('brcsgo:events', events);
      renderTab();
    });
  });
  document.querySelectorAll('[data-clear-winner]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const ev = events.find(e => e.id === selectedEventId); if(!ev) return;
      const stage = ev.stages[eventDetailStage]; if(!stage) return;
      const m = stage.matches.find(x => x.id === btn.dataset.clearWinner); if(!m) return;
      m.winner = null;
      await saveShared('brcsgo:events', events);
      renderTab();
    });
  });

  // modal
  const overlay = document.getElementById('eventModalOverlay');
  if(overlay){
    overlay.addEventListener('click', (e) => { if(e.target === overlay) closeEventModal(); });
    const closeBtn = document.getElementById('btnCloseModal'); if(closeBtn) closeBtn.addEventListener('click', closeEventModal);
    const cancelBtn = document.getElementById('btnCancelEvent'); if(cancelBtn) cancelBtn.addEventListener('click', closeEventModal);
    const saveBtn = document.getElementById('btnSaveEvent'); if(saveBtn) saveBtn.addEventListener('click', saveNewEvent);
    document.querySelectorAll('[data-fmt-cb]').forEach(cb => {
      cb.addEventListener('change', () => {
        eventModalDraft.format[cb.dataset.fmtCb] = cb.checked;
        cb.closest('.fmt-chip').classList.toggle('on', cb.checked);
      });
    });
  }
}

      if(val){ img.src = val; if(dl) dl.href = val; }

    });

    modeSelect.addEventListener('change', () => updateFormForMode(modeSelect.value));
  }

  attachModAndActionEvents();

  const form = document.getElementById('matchForm');
  if(form){
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = userProfile.playerName;
      const file = document.getElementById('f_proof').files[0];
      if(!file){ alert('Anexe um print do placar final da partida.'); return; }

      const modeKey = document.getElementById('f_mode').value;
      const cfg = MODES[modeKey];
      const kills = parseInt(document.getElementById('f_kills').value) || 0;
      const deaths = parseInt(document.getElementById('f_deaths').value) || 0;
      const assists = cfg.fields.includes('assists') ? (parseInt(document.getElementById('f_assists').value) || 0) : 0;
      const pontos = cfg.fields.includes('pontos') ? (parseInt(document.getElementById('f_pontos').value) || 0) : 0;
      const mvps = cfg.fields.includes('mvps') ? (parseInt(document.getElementById('f_mvps').value) || 0) : 0;
      const result = cfg.hasResultado ? document.getElementById('f_result').value : null;

      const match = {
        id: 'm_' + Date.now() + '_' + Math.floor(Math.random()*1000),
        playerId: currentPlayerId,
        mode: modeKey,
        date: document.getElementById('f_date').value,
        map: document.getElementById('f_map').value,
        result, kills, deaths, assists, pontos, mvps,
        status: 'pendente',
        correctedByAI: false,
        aiNote: '',
        createdAt: Date.now()
      };

      // Salva e libera o jogador NA HORA — a verificação por IA roda depois, em segundo plano
      matches.push(match);
      await saveShared('brcsgo:matches', matches);
      viewMode = modeKey;
      lastUsedMode = modeKey;
      lastUsedMap = match.map;
      await saveLocal('brcsgo:lastMode', modeKey);
      await saveLocal('brcsgo:lastMap', match.map);

      showToast('Partida enviada! Verificando em segundo plano...');
      activeTab = 'perfil';
      render();

      verifyMatchInBackground(match.id, name, modeKey, file);
    });
  }
}

async function verifyMatchInBackground(matchId, playerName, modeKey, file){
  const cfg = MODES[modeKey];
  let proofData = null;
  try{ proofData = await compressImage(file); }catch(err){ console.error(err); }
  if(proofData){
    try{ await setDoc('brcsgo:proof:' + matchId, proofData); }catch(err){}
  }
  if(!proofData) { renderTab(); return; }

  const ai = await analyzeProof(proofData, playerName, modeKey);

  // recarrega o estado mais recente do banco, pra não sobrescrever uma decisão
  // que um moderador já possa ter tomado manualmente enquanto a IA processava
  const freshMatches = await loadShared('brcsgo:matches');
  const idx = freshMatches.findIndex(m => m.id === matchId);
  if(idx === -1) return;
  const match = freshMatches[idx];
  if(match.status !== 'pendente') return;

  if(!ai || ai.legivel === false){
    match.aiNote = 'A IA não conseguiu confirmar os dados no print — revisão manual necessária.' + (ai && ai.observacao ? ' (' + ai.observacao + ')' : '');
  } else {
    const diffs = [];
    ['kills','deaths','assists','pontos','mvps'].forEach(f => {
      if(!cfg.fields.includes(f)) return;
      if(ai[f] !== null && ai[f] !== undefined && Number(ai[f]) !== match[f]){
        diffs.push({field:f, from:match[f], to:Number(ai[f])});
      }
    });
    if(cfg.hasResultado && ai.resultado){
      const aiResult = normalizeResultado(ai.resultado);
      if(aiResult && aiResult !== match.result) diffs.push({field:'result', from:match.result, to:aiResult});
    }
    if(ai.mapa){
      const aiMap = matchMap(ai.mapa);
      if(aiMap && aiMap !== match.map) diffs.push({field:'map', from:match.map, to:aiMap});
    }
    let modeWarning = '';
    if(ai.modo){
      const aiMode = matchMode(ai.modo);
      if(aiMode && aiMode !== modeKey){
        modeWarning = 'O print parece ser de ' + MODES[aiMode].label + ', mas a partida foi registrada como ' + MODES[modeKey].label + ' — confira antes de aprovar.';
      }
    }

    if(diffs.length === 0 && !modeWarning){
      match.status = 'aprovada';
      match.aiNote = 'IA confirmou todas as estatísticas do print.';
      deleteDoc('brcsgo:proof:' + matchId);
    } else {
      diffs.forEach(d => { match[d.field] = d.to; });
      match.correctedByAI = diffs.length > 0;
      const notes = [];
      if(diffs.length) notes.push('IA ajustou valores divergentes do print: ' + diffs.map(d => FIELD_LABELS[d.field] + ' ' + d.from + ' → ' + d.to).join(', '));
      if(modeWarning) notes.push('⚠ ' + modeWarning);
      match.aiNote = notes.join(' ');
    }
  }

  freshMatches[idx] = match;
  await saveShared('brcsgo:matches', freshMatches);
  matches = freshMatches;
  renderTab();
}

function attachModAndActionEvents(){
  const histSel = document.getElementById('histPlayer');
  if(histSel) histSel.addEventListener('change', () => { histPlayerId = histSel.value; renderTab(); });
  document.querySelectorAll('[data-remove-match]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if(!(userProfile && userProfile.role === 'moderator')) return;
      const lg = (document.documentElement.lang || 'pt').slice(0,2);
      const msg = {
        pt: 'Remover esta partida aprovada do histórico? O ELO do jogador será recalculado e isso não pode ser desfeito.',
        en: "Remove this approved match from the history? The player's ELO will be recalculated and this can't be undone.",
        es: '¿Eliminar esta partida aprobada del historial? El ELO del jugador se recalculará y no se puede deshacer.'
      }[lg];
      if(!confirm(msg)) return;
      const id = btn.dataset.removeMatch;
      const idx = matches.findIndex(m => m.id === id);
      if(idx < 0) return;
      matches.splice(idx, 1);
      await saveShared('brcsgo:matches', matches);
      deleteDoc('brcsgo:proof:' + id);
      showToast({pt:'Partida removida do histórico.', en:'Match removed from history.', es:'Partida eliminada del historial.'}[lg]);
      renderTab();
    });
  });
  document.querySelectorAll('[data-approve]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.approve;
      const m = matches.find(m => m.id === id);
      if(m) m.status = 'aprovada';
      await saveShared('brcsgo:matches', matches);
      deleteDoc('brcsgo:proof:' + id);
      renderTab();
    });
  });
  document.querySelectorAll('[data-reject]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if(!confirm('Rejeitar esta partida?')) return;
      const id = btn.dataset.reject;
      const m = matches.find(m => m.id === id);
      if(m) m.status = 'rejeitada';
      await saveShared('brcsgo:matches', matches);
      deleteDoc('brcsgo:proof:' + id);
      renderTab();
    });
  });
}

  if(skinDB || skinLoading) return;
  skinLoading = true; skinErr = false; mkOffline = false;
  let api = [];
  try{
    const r = await fetch(MK.URL); if(!r.ok) throw new Error('http ' + r.status);
    const raw = await r.json();
    api = raw.filter(s => s && s.name).map(s => ({
      id: String(s.id), name: s.name, img: mkImg(s.image),
      cat: (s.category && s.category.name) || 'Outros', rar: (s.rarity && s.rarity.name) || '',
      col: (s.rarity && s.rarity.color) || '#888', min: s.min_float != null ? +s.min_float : 0, max: s.max_float != null ? +s.max_float : 1,
      st: !!s.stattrak, base: mkBase(s)
    }));
  }catch(e){ console.error('Skins (API):', e); mkOffline = true; }
  try{
    const seen = new Set(api.map(s => mkNorm(s.name)));
    skinDB = api.concat(mkLocalCatalog().filter(s => !seen.has(mkNorm(s.name))));
    skinMap = {};
    skinDB.forEach(s => { s.low = mkPrice(s.base, s.name, s.max, 0, false); skinMap[s.id] = s; });
  }catch(e){ console.error('Skins:', e); skinErr = true; }
  skinLoading = false;
  if(activeTab === 'mercado' || activeTab === 'inventario') renderTab();
}

// ---- preço em Tokens: desgaste + pattern + StatTrak ----
function mkWearMult(f){
  for(let i=1;i<MK_XS.length;i++) if(f <= MK_XS[i]) return MK_YS[i-1] + (MK_YS[i]-MK_YS[i-1]) * (f-MK_XS[i-1])/(MK_XS[i]-MK_XS[i-1]);
  return MK_YS[MK_YS.length-1];
}
function mkWearName(f){ for(const w of MK_WEARS) if(f <= w[2]) return w[0]; return MK_WEARS[4][0]; }
function mkPat(name, seed){
  const sens = /Case Hardened|Heat Treated|Fade|Doppler|Crimson Web|Slaughter|Tiger Tooth|Lore|Gamma|Autotronic|Freehand/i.test(name);
  if(/Case Hardened|Heat Treated/i.test(name) && [661,670,321,955,387,179,151,168].indexOf(seed) >= 0) return { n:'Blue Gem', m:9 };
  const h = ((seed * 2654435761) >>> 0) % 1000 / 10;
  if(h < 1.5) return { n:'Pattern raro', m: sens ? 3.2 : 1.7 };
  if(h < 12)  return { n:'Bom pattern', m: sens ? 1.8 : 1.25 };
  if(h > 92)  return { n:'Pattern fraco', m: sens ? 0.8 : 0.92 };
  return { n:'Padrão', m:1 };
}
function mkPrice(base, name, f, seed, st){
  return Math.max(1, Math.round(base * mkWearMult(f) * mkPat(name, seed).m * (st ? 1.6 : 1)));
}
function mkItemVal(it){ return mkPrice(it.b, it.n, it.f, it.sd, it.st); }
function mkListings(s){
  const out = [];
  for(let i=0;i<8;i++){
    const r = mkSeeded(mkHash(s.id + ':' + i));
    const f = Math.min(s.max, s.min + (s.max - s.min) * Math.pow(i/7, 1.4) * (0.9 + r()*0.1));
    const sd = 1 + Math.floor(r()*1000), st = s.st && i % 3 === 0;
    out.push({ f, sd, st, price: mkPrice(s.base, s.name, f, sd, st) });
  }
  return out;
}
function mkNewItem(s, f, sd, st){ return { u:'i_' + Date.now() + '_' + Math.floor(Math.random()*1e6), id:s.id, n:s.name, img:s.img, col:s.col, cat:s.cat, b:s.base, f, sd, st }; }

function mkTarget(){ return skinMap[mk.tid] || null; }
function mkTargetVal(s){ const wb = MK_WEARS[mk.tw]; const lo = Math.max(s.min, wb[1]), hi = Math.min(s.max, wb[2]); return mkPrice(s.base, s.name, (lo+hi)/2, 0, false); }
function mkUpState(){

  const t = mkTarget(), tv = t ? mkTargetVal(t) : 0;
  const chance = (t && tv > sv && sv > 0) ? Math.min(0.75, Math.max(0.01, sv/tv * (1 - MK.EDGE))) : 0;
  return { stake, sv, t, tv, chance };
}

async function mkUpgrade(){
  const u = mkUpState(); if(mk.spin || !u.chance) return;
  mk.spin = true; mk.res = null;
  const roll = mkRand(), win = roll < u.chance;
  wallet.inv = wallet.inv.filter(i => mk.up.indexOf(i.u) < 0);
  let name = '';
  if(win){
    const wb = MK_WEARS[mk.tw], lo = Math.max(u.t.min, wb[1]), hi = Math.min(u.t.max, wb[2]);
    const it = mkNewItem(u.t, lo + (hi-lo)*mkRand(), 1 + Math.floor(mkRand()*1000), false); wallet.inv.push(it); name = u.t.name;
  }
  await mkSave();
  const ptr = document.getElementById('upPtr'), btn = document.getElementById('upGo'); if(btn) btn.disabled = true;
  if(ptr){ ptr.style.transition = 'transform 4.2s cubic-bezier(.12,.7,.1,1)'; requestAnimationFrame(() => requestAnimationFrame(() => { ptr.style.transform = 'rotate(' + (360*6 + roll*360) + 'deg)'; })); }
  setTimeout(() => { mk.spin = false; mk.up = []; mk.res = { win, name }; renderTab(); }, 4500);
}

  on('#mkRar', 'change', e => { mk.rar = e.target.value; mk.n = 48; renderTab(); });
  on('#mkSort', 'change', e => { mk.sort = e.target.value; renderTab(); });
  on('[data-sell]', 'click', async e => {
    const it = wallet.inv.find(i => i.u === e.currentTarget.dataset.sell); if(!it) return;
    wallet.tokens = Math.round((wallet.tokens + mkItemVal(it)*MK.SELL)*100)/100;
    wallet.inv = wallet.inv.filter(i => i.u !== it.u); await mkSave(); showToast('Skin vendida.'); renderTab();
  });
  on('[data-upitem]', 'click', e => { if(mk.spin) return; const u = e.currentTarget.dataset.upitem, i = mk.up.indexOf(u); if(i >= 0) mk.up.splice(i,1); else mk.up.push(u); mk.res = null; renderTab(); });
  on('[data-target]', 'click', e => { if(mk.spin) return; mk.tid = e.currentTarget.dataset.target; const t = mkTarget(); mk.tw = MK_WEARS.findIndex((w,i) => t.max >= w[1] && t.min <= w[2]); mk.res = null; renderTab(); });
  on('#upQ', 'input', e => { mk.tq = e.target.value; renderTab(); mkRefocus('upQ'); });
  on('#upW', 'change', e => { mk.tw = +e.target.value; renderTab(); });
  on('#upGo', 'click', mkUpgrade);
}

async function init(){
  if(!db){
    storageAvailable = false;
  }
  let auth = null;
  try{ if(typeof firebase !== 'undefined') auth = firebase.auth(); }catch(e){}
  if(!auth){
    document.getElementById('app').innerHTML = '<div class="storage-warning">⚠ O sistema de login (Firebase Authentication) não pôde ser iniciado. Confira se ele está ativado no seu projeto Firebase (Build → Authentication → Sign-in method → Email/Senha).</div>';
    return;
  }

  const lastMode = await loadLocal('brcsgo:lastMode');
  if(lastMode && MODES[lastMode]) lastUsedMode = lastMode;
  const lastMap = await loadLocal('brcsgo:lastMap');
  if(lastMap && MAPS.includes(lastMap)) lastUsedMap = lastMap;

  auth.onAuthStateChanged(async (user) => {
    if(!user){
      authUser = null;
      userProfile = null;
      stopChat();
      renderAuthGate();
      return;
    }
    authUser = user;
    players = await loadShared('brcsgo:players');
    matches = await loadShared('brcsgo:matches');
    users = await loadShared('brcsgo:users');
    events = await loadShared('brcsgo:events');
    if(!Array.isArray(events)) events = [];
    try{ const seen = localStorage.getItem('brcsgo:seenEvents:'+user.uid); seenEventIds = seen ? JSON.parse(seen) : []; }catch(e){ seenEventIds = []; }
    matches.forEach(m => {
      if(!m.status) m.status = 'aprovada';
      if(!m.mode) m.mode = 'competitivo';
      if(m.pontos === undefined) m.pontos = (m.kills||0) * 2;
    });
    userProfile = users.find(u => u.uid === user.uid) || null;
    if(!userProfile){
      // conta existe na autenticação (ex: primeiro login via Google/GitHub) mas ainda não escolheu um nick
      currentPlayerId = null;
      renderProfileSetupGate();
      return;
    }
    currentPlayerId = user.uid;
    try{ await mkLoadWallet(); }catch(e){ console.error(e); }
    if(activeTab === 'moderacao' && userProfile.role !== 'moderator') activeTab = 'ranking';
    render();
    startChat();
  });
}



// ====================================================================
//  CHAT da comunidade (tempo real via Firestore) + COMPARTILHAR rank
// ====================================================================
function decodeEntities(str){ const t = document.createElement('textarea'); t.innerHTML = String(str == null ? '' : str); return t.value; }

let chatMsgs = [], chatUnsubs = [], chatUnread = 0, chatDay = '', chatLastSend = 0, chatLoaded = false, chatSeenTs = 0, chatDays = {}, chatBadgeCache = {t:0, map:{}};
const CHAT_MAX_LEN = 280, CHAT_KEEP = 150;
function chatDayKey(offsetDays){ const d = new Date(Date.now() - (offsetDays||0)*86400000); return d.getUTCFullYear() + '-' + String(d.getUTCMonth()+1).padStart(2,'0') + '-' + String(d.getUTCDate()).padStart(2,'0'); }
function chatSeenKey(){ return 'brcsgo:chatseen:' + (authUser ? authUser.uid : ''); }

function startChat(){
  if(!db || !authUser || chatUnsubs.length) return;
  try{ chatSeenTs = Number(localStorage.getItem(chatSeenKey())) || 0; }catch(e){ chatSeenTs = 0; }
  chatDay = chatDayKey(0); chatDays = {}; chatLoaded = false;
  [chatDayKey(1), chatDay].forEach(key => {
    const unsub = db.collection('brcsgo').doc('chat:' + key).onSnapshot(snap => {
      chatDays[key] = (snap.exists && Array.isArray(snap.data().msgs)) ? snap.data().msgs : [];
      mergeChat();
    }, err => { console.warn('Chat indisponível:', err && err.code); });
    chatUnsubs.push(unsub);
  });
}
function stopChat(){
  chatUnsubs.forEach(u => { try{ u(); }catch(e){} });
  chatUnsubs = []; chatMsgs = []; chatDays = {}; chatUnread = 0; chatLoaded = false;
}
setInterval(() => { if(chatUnsubs.length && chatDay !== chatDayKey(0)){ stopChat(); startChat(); } }, 60000);   // virou o dia (UTC)

function mergeChat(){
  const prevLast = chatMsgs.length ? chatMsgs[chatMsgs.length-1].ts : 0;
  let all = [];
  Object.keys(chatDays).forEach(k => { all = all.concat(chatDays[k]); });
  all = all.filter(m => m && typeof m.text === 'string' && typeof m.uid === 'string' && m.ts).sort((a,b) => a.ts - b.ts).slice(-CHAT_KEEP);
  chatMsgs = all;
  const mine = authUser ? authUser.uid : '';
  if(activeTab === 'chat'){
    chatSeenTs = chatMsgs.length ? chatMsgs[chatMsgs.length-1].ts : chatSeenTs;
    try{ localStorage.setItem(chatSeenKey(), String(chatSeenTs)); }catch(e){}
    chatUnread = 0;
    updateChatList();
  } else {
    chatUnread = chatMsgs.filter(m => m.ts > chatSeenTs && m.uid !== mine).length;
    updateChatPill();
  }
  const incoming = chatMsgs.length && chatMsgs[chatMsgs.length-1].ts > prevLast && chatMsgs[chatMsgs.length-1].uid !== mine;
  if(chatLoaded && incoming && window.SFX) window.SFX.play('notify');
  if(Object.keys(chatDays).length >= 2) chatLoaded = true;
}
function updateChatPill(){
  document.querySelectorAll('.chat-pill').forEach(el => { el.hidden = chatUnread <= 0; el.textContent = chatUnread > 0 ? (chatUnread > 99 ? '99+' : chatUnread) : ''; });
}
function chatBadgeFor(uid){
  const now = Date.now();
  if(now - chatBadgeCache.t > 30000){ chatBadgeCache = {t: now, map: {}, pos: null}; }
  if(chatBadgeCache.map[uid] !== undefined) return chatBadgeCache.map[uid];
  let html = '';
  try{
    const pl = players.find(x => x.id === uid || x.ownerUid === uid);
    if(pl && MODES.competitivo){
      const st = computeModeStats(pl.id, 'competitivo');

      }
    }
  }catch(e){}
  chatBadgeCache.map[uid] = html;
  return html;
}

/* ================= MAP CHOOSER (veto de mapas estilo Premier / FACEIT / GC) =================
   Você (time A) escolhe os bans do seu time; o sistema (time B) bane mapas aleatoriamente.
   Imagens: screenshots reais do CS2 (repo MurkyYT/cs2-map-icons), liberadas em img-src no CSP do <head>.
   Para editar o pool, mexa em MC_MAPS (duty:true = Active Duty). */
const MC_BASE = 'https://raw.githubusercontent.com/MurkyYT/cs2-map-icons/main/images/';
const MC_MAPS = [
  {id:'de_ancient',  name:'Ancient',  duty:true},
  {id:'de_anubis',   name:'Anubis',   duty:true},
  {id:'de_cache',    name:'Cache',    duty:true},
  {id:'de_dust2',    name:'Dust II',  duty:true},
  {id:'de_inferno',  name:'Inferno',  duty:true},
  {id:'de_mirage',   name:'Mirage',   duty:true},
  {id:'de_nuke',     name:'Nuke',     duty:true},
  {id:'de_overpass', name:'Overpass'},
  {id:'de_train',    name:'Train'},
  {id:'de_vertigo',  name:'Vertigo'},
  {id:'cs_office',   name:'Office'},
  {id:'cs_italy',    name:'Italy'},
  {id:'de_boulder',  name:'Boulder'},
  {id:'de_fachwerk', name:'Fachwerk'},
  {id:'cs_shelter',  name:'Shelter'}
];
const MC_COLOR = { A:'#E5262B', B:'#C9CCDA' };
const MC_DEFAULT = { A:'Seu time', B:'Adversário' };
let mc = {
  pool: MC_MAPS.filter(m => m.duty).map(m => m.id),
  teams: { A:{name:'', leader:''}, B:{name:''} },   // A = você · B = sistema (aleatório)
  first: 'random',      // 'random' | 'A' | 'B'
  phase: 'setup',       // 'setup' | 'veto' | 'done'
  start: 'A',
  bans: [],             // [{id, team}]
  leaderInit: false,
  bgId: null
};
const mcImgCache = {};
const mcPending = {};
let mcBgTimer = null, mcBgFront = 0, mcBotTimer = null;

function mcMap(id){ return MC_MAPS.find(m => m.id === id); }
function mcRemaining(){ const banned = new Set(mc.bans.map(b => b.id)); return mc.pool.filter(id => !banned.has(id)); }
function mcTurn(){ return (mc.bans.length % 2 === 0) ? mc.start : (mc.start === 'A' ? 'B' : 'A'); }
function mcTeamLabel(t){ return (mc.teams[t].name || '').trim() || MC_DEFAULT[t]; }
function mcLeaderLabel(){ return (mc.teams.A.leader || '').trim(); }
function mcPresetKey(){
  const same = (a, b) => a.length === b.length && a.every(x => b.includes(x));
  if(same(mc.pool, MC_MAPS.filter(m => m.duty).map(m => m.id))) return 'duty';
  if(same(mc.pool, MC_MAPS.map(m => m.id))) return 'all';
  return 'custom';
}

/* ---------- imagens (thumbnail -> thumbnail alternativa -> ícone) ---------- */
function mcLoad(id){
  if(mcImgCache[id] !== undefined) return Promise.resolve(mcImgCache[id]);
  if(mcPending[id]) return mcPending[id];
  mcPending[id] = new Promise(resolve => {
    const srcs = [MC_BASE + 'thumbs/' + id + '_1_png.png', MC_BASE + 'thumbs/' + id + '_png.png', MC_BASE + id + '.png'];
    let i = 0;
    const next = () => {
      if(i >= srcs.length){ mcImgCache[id] = false; delete mcPending[id]; resolve(false); return; }
      const url = srcs[i++], img = new Image();
      img.onload = () => { mcImgCache[id] = url; delete mcPending[id]; resolve(url); };
      img.onerror = next;
      img.src = url;
    };
    next();
  });
  return mcPending[id];
}
function mcSetImg(el, url){ el.style.backgroundImage = 'url("' + url + '")'; el.classList.add('has-img'); }
function mcApplyImages(root){
  const els = root.querySelectorAll('[data-mc-img]');
  const apply = el => mcLoad(el.dataset.mcImg).then(url => { if(url && el.isConnected) mcSetImg(el, url); });
  let io = null;
  if('IntersectionObserver' in window){
    io = new IntersectionObserver(entries => {
      entries.forEach(en => { if(en.isIntersecting){ io.unobserve(en.target); apply(en.target); } });
    }, {rootMargin:'240px'});
  }
  els.forEach(el => {
    const c = mcImgCache[el.dataset.mcImg];
    if(c){ mcSetImg(el, c); return; }
    if(c === false) return;
    if(io) io.observe(el); else apply(el);
  });
}

/* ---------- fundo com os mapas reais ---------- */
function mcBgStop(){ if(mcBgTimer){ clearInterval(mcBgTimer); mcBgTimer = null; } }
function mcBgShow(id, instant){
  const bg = document.getElementById('mcBg'); if(!bg || !id) return;
  mc.bgId = id;
  const show = url => {
    const b = document.getElementById('mcBg'); if(!url || !b) return;
    const layers = b.querySelectorAll('.mc-bg-l'); if(layers.length < 2) return;
    mcBgFront = 1 - mcBgFront;
    const front = layers[mcBgFront], back = layers[1 - mcBgFront];
    if(instant){ front.style.transition = 'none'; back.style.transition = 'none'; }
    front.style.backgroundImage = 'url("' + url + '")';
    front.classList.add('on'); back.classList.remove('on');
    if(instant){ void front.offsetWidth; front.style.transition = ''; back.style.transition = ''; }
  };
  if(mcImgCache[id]) show(mcImgCache[id]); else mcLoad(id).then(show);
}
function mcBgList(){
  const l = mc.phase === 'veto' ? mcRemaining() : mc.pool;
  return l.length ? l : MC_MAPS.map(m => m.id);
}
function mcBgStart(){
  mcBgStop();
  if(!document.getElementById('mcBg')) return;
  if(mc.phase === 'done'){ const p = mcRemaining()[0]; if(p){ mcBgShow(p, true); return; } }
  const list = mcBgList();
  if(mc.bgId && list.includes(mc.bgId)) mcBgShow(mc.bgId, true);
  else mcBgShow(list[Math.floor(Math.random() * list.length)], true);
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  mcBgTimer = setInterval(() => {
    if(!document.getElementById('mcBg') || activeTab !== 'mapchooser'){ mcBgStop(); return; }
    const l = mcBgList();
    mcBgShow(l[(l.indexOf(mc.bgId) + 1) % l.length]);
  }, 7000);
}

/* ---------- sistema: bane aleatoriamente pelo adversário ---------- */
function mcCancelBot(){ if(mcBotTimer){ clearTimeout(mcBotTimer); mcBotTimer = null; } }
function mcScheduleBot(){
  if(mc.phase !== 'veto' || mcTurn() !== 'B' || mcBotTimer) return;
  mcBotTimer = setTimeout(() => {
    mcBotTimer = null;
    if(mc.phase !== 'veto' || mcTurn() !== 'B' || activeTab !== 'mapchooser') return;
    const r = mcRemaining();
    mcBan(r[Math.floor(Math.random() * r.length)], 'B');
  }, 1000 + Math.random() * 700);
}

/* ---------- ações ---------- */
function mcResultText(){
  const pid = mcRemaining()[0];
  const l = mcLeaderLabel();
  const lines = ['MAP CHOOSER — BRCS2', mcTeamLabel('A') + (l ? ' (' + l + ')' : '') + ' x ' + mcTeamLabel('B'), '', 'Bans:'];
  mc.bans.forEach((b, i) => lines.push((i + 1) + '. ' + mcTeamLabel(b.team) + ' baniu ' + mcMap(b.id).name));
  lines.push('', 'Mapa da partida: ' + (mcMap(pid) ? mcMap(pid).name : '-'));
  return lines.join('\n');
}
function mcSetPool(ids){ const set = new Set(ids); mc.pool = MC_MAPS.filter(m => set.has(m.id)).map(m => m.id); }
function mcBan(id, team){
  if(mc.phase !== 'veto' || !mcRemaining().includes(id)) return;
  if(team && team !== mcTurn()) return;
  mc.bans.push({id, team: mcTurn()});
  if(mcRemaining().length === 1){
    mc.phase = 'done'; mcCancelBot();
    const m = mcMap(mcRemaining()[0]);
    if(m) showToast('Mapa da partida: ' + m.name);
  }
  renderTab();
}
// desfaz o último ban seu e tudo que veio depois (inclusive o ban aleatório do sistema)
function mcUndo(){
  let idx = -1;
  for(let i = mc.bans.length - 1; i >= 0; i--){ if(mc.bans[i].team === 'A'){ idx = i; break; } }
  if(idx < 0) return;
  mcCancelBot();
  mc.bans = mc.bans.slice(0, idx); mc.phase = 'veto'; renderTab();
}
function mcStart(){
  if(mc.pool.length < 2) return;
  mcCancelBot();
  mc.bans = []; mc.phase = 'veto';
  mc.start = mc.first === 'random' ? (Math.random() < 0.5 ? 'A' : 'B') : mc.first;
  if(mc.first === 'random') showToast('Sorteio: ' + (mc.start === 'A' ? 'você bane primeiro' : 'o sistema bane primeiro'));
  renderTab();
}
function mcToSetup(){
  mcCancelBot();
  mc.bans = []; mc.phase = 'setup';
  Object.keys(mcImgCache).forEach(k => { if(mcImgCache[k] === false) delete mcImgCache[k]; });
  renderTab();
}

function attachMapChooserEvents(){
  const root = document.getElementById('tabContent'); if(!root) return;
  mcApplyImages(root);
  mcBgStart();
  mcScheduleBot();
  const on = (sel, fn) => root.querySelectorAll(sel).forEach(el => {
    el.addEventListener('click', e => fn(el, e));
    if(el.getAttribute('role') === 'button') el.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); fn(el, e); } });
  });
  on('[data-mc-preset]', el => { mcSetPool(el.dataset.mcPreset === 'all' ? MC_MAPS.map(m => m.id) : MC_MAPS.filter(m => m.duty).map(m => m.id)); renderTab(); });
  on('[data-mc-toggle]', el => {
    const id = el.dataset.mcToggle;
    mcSetPool(mc.pool.includes(id) ? mc.pool.filter(x => x !== id) : mc.pool.concat(id));
    renderTab();
  });
  on('[data-mc-first]', el => { mc.first = el.dataset.mcFirst; renderTab(); });
  root.querySelectorAll('[data-mc-field]').forEach(inp => inp.addEventListener('input', () => {
    const t = inp.dataset.mcTeam, f = inp.dataset.mcField;
    if(mc.teams[t] && (f === 'name' || (f === 'leader' && t === 'A'))) mc.teams[t][f] = inp.value.slice(0, 24);
  }));
  on('[data-mc-ban]', el => mcBan(el.dataset.mcBan, 'A'));
  const click = (id, fn) => { const b = document.getElementById(id); if(b) b.addEventListener('click', fn); };
  click('mcStart', mcStart);
  click('mcUndo', mcUndo);
  click('mcBack', mcToSetup);
  click('mcNew', mcToSetup);
  click('mcCopy', async () => {
    try{ await navigator.clipboard.writeText(mcResultText()); showToast('Resultado copiado'); }
    catch(e){ showToast('Não foi possível copiar automaticamente'); }
  });
  click('mcUse', () => {
    const m = mcMap(mcRemaining()[0]);
    if(m && MAPS.includes(m.name)){ lastUsedMap = m.name; activeTab = 'registrar'; render(); showToast('Mapa ' + m.name + ' selecionado no Registrar'); }
  });
}

function updateChatList(){
  const list = document.getElementById('chatList'); if(!list) return;
  const nearBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 90;
  list.innerHTML = chatListHTML();
  if(nearBottom) list.scrollTop = list.scrollHeight;
}
async function sendChat(){
  const input = document.getElementById('chatInput'); if(!input || !db || !authUser || !userProfile) return;
  const text = input.value.replace(/\s+/g, ' ').trim().slice(0, CHAT_MAX_LEN);
  if(!text) return;
  if(Date.now() - chatLastSend < 1500){ showToast('Calma! Espere um instante antes de enviar outra mensagem.'); return; }
  chatLastSend = Date.now();
  input.value = '';
  const day = chatDayKey(0);
  const msg = { id: Date.now().toString(36) + Math.random().toString(36).slice(2,7), uid: authUser.uid, name: decodeEntities(userProfile.playerName).slice(0,24), text, ts: Date.now(), day };
  try{
    await db.collection('brcsgo').doc('chat:' + day).set({ msgs: firebase.firestore.FieldValue.arrayUnion(msg) }, { merge: true });
  }catch(e){
    console.error('Erro ao enviar mensagem', e);
    input.value = text;
    showToast('Não foi possível enviar a mensagem.');
  }
}
function attachChatEvents(){
  chatSeenTs = chatMsgs.length ? chatMsgs[chatMsgs.length-1].ts : chatSeenTs;
  try{ localStorage.setItem(chatSeenKey(), String(chatSeenTs)); }catch(e){}
  chatUnread = 0; updateChatPill();
  const list = document.getElementById('chatList'), input = document.getElementById('chatInput'), btn = document.getElementById('chatSend');
  if(list) list.scrollTop = list.scrollHeight;
  if(btn) btn.addEventListener('click', sendChat);
  if(input){
    input.addEventListener('keydown', e => { if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendChat(); } });
    if(window.matchMedia && matchMedia('(hover:hover)').matches) input.focus();
  }
  if(list) list.addEventListener('click', async e => {
    const b = e.target.closest('[data-chat-del]'); if(!b || !userProfile || userProfile.role !== 'moderator') return;
    const m = chatMsgs.find(x => x.id === b.dataset.chatDel); if(!m) return;
    try{ await db.collection('brcsgo').doc('chat:' + (m.day || chatDayKey(0))).update({ msgs: firebase.firestore.FieldValue.arrayRemove(m) }); }
    catch(err){ showToast('Não foi possível apagar a mensagem.'); }
  });
}

// ---------------- Compartilhar ----------------
function shareRowHTML(cfg, s){
  if(!cfg.hasPatente || s.calibrating) return '';
  return `<div class="share-row"><button class="secondary" id="shareBtn" type="button">↗ Compartilhar meu rank</button></div>`;
}
function attachShareEvents(){
  const b = document.getElementById('shareBtn');
  if(b) b.addEventListener('click', openShareModal);
}
function shareUrl(){ return /^https?:$/.test(location.protocol) ? location.origin + location.pathname : ''; }
function shareInfo(p, s, tier){
  const hidden = isEloHidden(s.elo);
  return {
    name: decodeEntities(p.name), mode: MODES[viewMode].label,
    rank: tier.challenger ? 'CHALLENGER' : 'NÍVEL ' + tier.level,
    top: tier.top ? 'TOP ' + tier.top : '', pos: tier.pos || 0,
    eloLine: hidden ? 'ELO OCULTO' : s.elo + ' ELO',
    total: s.total, wins: s.wins, winRate: s.winRate, kd: s.kd, color: tier.color, tier
  };
}
function shareText(i){
  const rk = i.rank === 'CHALLENGER' ? 'Challenger' + (i.top ? ' ' + i.top : '') : 'Nível ' + i.rank.replace('NÍVEL ','');
  return `Sou ${rk} no BRCS2 (${i.mode})! ${i.eloLine === 'ELO OCULTO' ? '' : i.eloLine + ' · '}${i.wins} vitórias · K/D ${i.kd.toFixed(2)}. Venha me desafiar!`;
}
function svgToImage(svg, size){
  return new Promise(resolve => {
    const img = new Image(); img.onload = () => resolve(img); img.onerror = () => resolve(null);
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg.replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" '));
  });
}
async function drawShareCard(canvas, info){
  const c = canvas.getContext('2d'), W = canvas.width, H = canvas.height;
  try{ if(document.fonts && document.fonts.ready) await document.fonts.ready; }catch(e){}
  const bg = c.createLinearGradient(0,0,W,H); bg.addColorStop(0,'#070818'); bg.addColorStop(.55,'#12090f'); bg.addColorStop(1,'#2b0a0d');
  c.fillStyle = bg; c.fillRect(0,0,W,H);
  const glow = c.createRadialGradient(290,315,20,290,315,420); glow.addColorStop(0,'rgba(229,38,43,.38)'); glow.addColorStop(1,'rgba(229,38,43,0)');
  c.fillStyle = glow; c.fillRect(0,0,W,H);
  c.strokeStyle = 'rgba(255,255,255,.05)'; c.lineWidth = 1;
  for(let x=0;x<W;x+=60){ c.beginPath(); c.moveTo(x,0); c.lineTo(x,H); c.stroke(); }
  for(let y=0;y<H;y+=60){ c.beginPath(); c.moveTo(0,y); c.lineTo(W,y); c.stroke(); }
  c.fillStyle = info.color || '#E5262B'; c.fillRect(0,0,10,H);
  const img = await svgToImage(tierIconSVG(info.tier, 340), 340);
  if(img) c.drawImage(img, 120, 145, 340, 340);
  const X = 520;
  c.textBaseline = 'alphabetic';
  c.fillStyle = 'rgba(255,255,255,.55)'; c.font = '600 26px "IBM Plex Mono", monospace'; c.fillText('BRCS2 · COUNTER-STRIKE 2', X, 120);
  let fs = 96; c.font = '700 ' + fs + 'px Rajdhani, sans-serif';
  while(c.measureText(info.name).width > W - X - 60 && fs > 40){ fs -= 4; c.font = '700 ' + fs + 'px Rajdhani, sans-serif'; }
  c.fillStyle = '#fff'; c.fillText(info.name, X, 225);
  c.fillStyle = info.color || '#E5262B'; c.font = '700 64px Rajdhani, sans-serif';
  c.fillText(info.rank + (info.top ? ' · ' + info.top : ''), X, 305);
  c.fillStyle = 'rgba(255,255,255,.8)'; c.font = '500 34px "IBM Plex Mono", monospace';
  c.fillText(info.eloLine + (info.pos ? ' · #' + info.pos + ' do site' : ''), X, 357);
  const stats = [['PARTIDAS', info.total], ['VITÓRIAS', info.wins], ['K/D', info.kd.toFixed(2)]];
  stats.forEach((st, i) => {
    const x = X + i * 210, y = 410;
    c.fillStyle = 'rgba(255,255,255,.06)'; c.fillRect(x, y, 190, 110);
    c.fillStyle = 'rgba(255,255,255,.5)'; c.font = '600 20px Inter, sans-serif'; c.fillText(st[0], x + 18, y + 36);
    c.fillStyle = '#fff'; c.font = '700 54px Rajdhani, sans-serif'; c.fillText(String(st[1]), x + 18, y + 92);
  });
  c.fillStyle = 'rgba(255,255,255,.45)'; c.font = '500 22px "IBM Plex Mono", monospace';
  c.fillText(info.mode + (shareUrl() ? ' · ' + location.host : ''), X, 580);
}
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch(e){
    try{ const t = document.createElement('textarea'); t.value = text; t.style.position = 'fixed'; t.style.opacity = '0'; document.body.appendChild(t); t.select(); const ok = document.execCommand('copy'); t.remove(); return ok; }
    catch(err){ return false; }
  }
}
async function openShareModal(){
  const p = players.find(x => x.id === currentPlayerId); if(!p) return;
  const s = computeModeStats(p.id, viewMode); if(!MODES[viewMode].hasPatente || s.calibrating) return;
  const tier = playerTier(p, s, viewMode), info = shareInfo(p, s, tier);
  const ov = document.createElement('div'); ov.className = 'modal-overlay'; ov.id = 'shareOverlay';
  ov.innerHTML = `<div class="modal share-modal" role="dialog" aria-label="Compartilhar meu rank">
      <h2 style="margin-top:0">Compartilhar meu rank</h2>
      <canvas id="shareCanvas" width="1200" height="630"></canvas>
      <div class="share-actions">
        <button class="primary" id="shNative" type="button">↗ Compartilhar</button>
        <button class="secondary" id="shWpp" type="button">WhatsApp</button>
        <button class="secondary" id="shX" type="button">X / Twitter</button>
        <button class="secondary" id="shDownload" type="button">Baixar imagem</button>
        <button class="secondary" id="shCopy" type="button">Copiar texto</button>
        <button class="secondary" id="shClose" type="button">Fechar</button>
      </div></div>`;
  document.body.appendChild(ov);
  const canvas = ov.querySelector('#shareCanvas');
  drawShareCard(canvas, info);
  const text = shareText(info), url = shareUrl();
  const close = () => { ov.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if(e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  ov.addEventListener('click', e => { if(e.target === ov) close(); });
  ov.querySelector('#shClose').onclick = close;
  const toBlob = () => new Promise(r => canvas.toBlob(r, 'image/png'));
  ov.querySelector('#shNative').onclick = async () => {
    try{
      const blob = await toBlob(), file = blob ? new File([blob], 'brcs2-rank.png', {type:'image/png'}) : null;
      if(file && navigator.canShare && navigator.canShare({files:[file]})) await navigator.share({files:[file], title:'BRCS2', text: text + (url ? ' ' + url : '')});
      else if(navigator.share) await navigator.share(url ? {title:'BRCS2', text, url} : {title:'BRCS2', text});
      else { await copyText(text + (url ? ' ' + url : '')); showToast('Texto copiado — cole onde quiser compartilhar.'); }
    }catch(e){ if(!e || e.name !== 'AbortError') showToast('Não foi possível compartilhar.'); }
  };
  ov.querySelector('#shWpp').onclick = () => window.open('https://wa.me/?text=' + encodeURIComponent(text + (url ? ' ' + url : '')), '_blank', 'noopener');
  ov.querySelector('#shX').onclick = () => window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(text) + (url ? '&url=' + encodeURIComponent(url) : ''), '_blank', 'noopener');
  ov.querySelector('#shDownload').onclick = async () => {
    const blob = await toBlob(); if(!blob) return;
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'brcs2-rank.png';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  };
  ov.querySelector('#shCopy').onclick = async () => { showToast((await copyText(text + (url ? ' ' + url : ''))) ? 'Texto copiado!' : 'Não foi possível copiar.'); };
}

// Microinterações do centro de comando.
document.addEventListener('pointermove', (event) => {
  document.querySelectorAll('.mission-hero, .panel').forEach((element) => {
    const bounds = element.getBoundingClientRect();
    if(event.clientX < bounds.left || event.clientX > bounds.right || event.clientY < bounds.top || event.clientY > bounds.bottom) return;
    element.style.setProperty('--mx', ((event.clientX - bounds.left) / bounds.width * 100) + '%');
    element.style.setProperty('--my', ((event.clientY - bounds.top) / bounds.height * 100) + '%');
    element.style.setProperty('--px', ((event.clientX - bounds.left) / bounds.width * 100) + '%');
    element.style.setProperty('--py', ((event.clientY - bounds.top) / bounds.height * 100) + '%');
  });
}, {passive:true});
init();
</script>

<script>

          var pm = challengerPositions(mode), pos = pm.get(p.id) || 0, tb = topBucket(pos);
          topInfo = {pos: pos, top: tb};
          var tkey = 'brcsgo:topseen:'+authUser.uid+':'+mode, tseen = getSeen(tkey);
          setSeen(tkey, tseen === null ? (tb || 99999) : Math.min(Number(tseen), tb || 99999));
          if(seen !== null && Number(seen) === 11 && tseen !== null && tb && tb < Number(tseen)){
            topPopup({top: tb, pos: pos, mode: MODES[mode].label});
            return;
          }
        }
        if(seen !== null && Number(seen) < 11 && lvl === 11){
          play({mode: MODES[mode].label, name: p.name, elo: st.elo, region: p.region || '', challenger: true, from10: Number(seen) === 10});
        } else if(seen !== null && Number(seen) < 10 && lvl === 10 && !getSeen(doneKey)){
          setSeen(doneKey, '1');   // marca ANTES de tocar: nunca mais repete
          play({mode: MODES[mode].label, name: p.name, elo: st.elo, region: p.region || '', challenger: false});
        } else if(seen !== null && lvl > Number(seen) && lvl < 10){
          levelUpPopup({level: lvl, elo: st.elo, mode: MODES[mode].label});   // subiu de nível (inclui sair da calibragem)
        }
      });
    }catch(e){}
  }
  setInterval(check, 1200);
  // pré-visualização: abra o site com #cutscene10 no final do endereço (ou use playLevel10Cutscene() no console)
  function preview(){ if(location.hash === '#levelup'){ window.playLevelUpPopup(4); history.replaceState(null,'',location.pathname+location.search); } if(location.hash === '#cutscene10'){ var n=document.querySelector('.name-cell'); play({mode:'Competitivo', name:(typeof userProfile!=='undefined'&&userProfile&&userProfile.playerName)||'Player', elo:2034, region:'', challenger:false}); history.replaceState(null,'',location.pathname+location.search); } }
  function previewCh(){ if(location.hash === '#challenger'){ play({mode:'Competitivo', name:(typeof userProfile!=='undefined'&&userProfile&&userProfile.playerName)||'Player', elo:7012, region:'', challenger:true, from10:true}); history.replaceState(null,'',location.pathname+location.search); } }
  window.addEventListener('hashchange', function(){ preview(); previewCh(); }); setTimeout(function(){ preview(); previewCh(); }, 2500);
})();
</script>
