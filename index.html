        </div>
      </div>
    </div>
  `;
}

function eventosHTML(){
  const detail = selectedEventId ? events.find(e => e.id === selectedEventId) : null;
  const body = detail ? eventDetailHTML(detail) : eventsListHTML();
  return body + eventModalHTML();
}

function openEventModal(){
  eventModalOpen = true;
  eventModalDraft = newEventDraft();
  renderTab();
}
function closeEventModal(){
  eventModalOpen = false;
  eventModalDraft = null;
  renderTab();
}

async function saveNewEvent(){
  const d = eventModalDraft;
  d.name = document.getElementById('ev_name').value.trim();
  d.sigla = document.getElementById('ev_sigla').value.trim().toUpperCase();
  d.description = document.getElementById('ev_desc').value.trim();
  d.reward = document.getElementById('ev_reward').value.trim();
  d.startDate = document.getElementById('ev_start').value;
  d.teamsRaw = document.getElementById('ev_teams').value;
  if(!d.name){ alert('Informe o nome do campeonato.'); return; }
  const teams = parseTeamsList(d.teamsRaw);
  if(teams.length < 2){ alert('Informe pelo menos 2 times.'); return; }
  const anyStage = Object.values(d.format).some(Boolean);
  if(!anyStage){ alert('Selecione ao menos uma fase.'); return; }
  const ev = {
    id: 'ev_' + Date.now().toString(36) + '_' + Math.floor(Math.random()*1000),
    name: d.name, sigla: d.sigla, description: d.description, reward: d.reward,
    startDate: d.startDate, teams, format: d.format,
    stages: buildStagesFromFormat(d.format, teams),
    status: 'upcoming', createdBy: userProfile.playerName, createdAt: Date.now(), winner: null
  };
  events.push(ev);
  await saveShared('brcsgo:events', events);
  showToast('Campeonato "'+ev.name+'" criado!');
  closeEventModal();
  selectedEventId = ev.id;
  eventDetailStage = 0;
  markEventSeen(ev.id);
  renderTab();
}

function attachEventosEvents(){
  // event banner (visible in any tab render since attachTabEvents runs each render)
  document.querySelectorAll('[data-goto-event]').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.dataset.gotoEvent;
      selectedEventId = id; activeTab = 'eventos'; eventDetailStage = 0; markEventSeen(id); render();
    });
  });
  if(activeTab !== 'eventos') return;

  const btnCreate = document.getElementById('btnCreateEvent');
  if(btnCreate) btnCreate.addEventListener('click', openEventModal);

  document.querySelectorAll('.event-card[data-event-id]').forEach(card => {
    card.addEventListener('click', () => {
      selectedEventId = card.dataset.eventId;
      eventDetailStage = 0;
      markEventSeen(selectedEventId);
      renderTab();
    });
  });

  const back = document.getElementById('btnBackEvents');
  if(back) back.addEventListener('click', () => { selectedEventId = null; renderTab(); });

  document.querySelectorAll('[data-stage-idx]').forEach(btn => {
    if(btn.classList.contains('st-btn')){
      btn.addEventListener('click', () => { eventDetailStage = parseInt(btn.dataset.stageIdx); renderTab(); });
    }
  });

  const adv = document.getElementById('btnAdvanceStage');
  if(adv) adv.addEventListener('click', async () => {
    const ev = events.find(e => e.id === selectedEventId); if(!ev) return;
    if(ev.status === 'upcoming') ev.status = 'live';
    advanceStage(ev, parseInt(adv.dataset.stageIdx));
    eventDetailStage++;
    await saveShared('brcsgo:events', events);
    showToast('Fase avançada!');
    renderTab();
  });

  const fin = document.getElementById('btnFinishEvent');
  if(fin) fin.addEventListener('click', async () => {
    const ev = events.find(e => e.id === selectedEventId); if(!ev) return;
    advanceStage(ev, ev.stages.length - 1);
    await saveShared('brcsgo:events', events);
    showToast('Campeonato encerrado!');
    renderTab();
  });

  const del = document.getElementById('btnDeleteEvent');
  if(del) del.addEventListener('click', async () => {
    if(!confirm('Excluir este campeonato? Não dá pra desfazer.')) return;
    events = events.filter(e => e.id !== del.dataset.eventId);
    selectedEventId = null;
    await saveShared('brcsgo:events', events);
    showToast('Campeonato excluído.');
    renderTab();
  });

  // score inputs
  document.querySelectorAll('input.score-inp').forEach(inp => {
    inp.addEventListener('change', async () => {
      const ev = events.find(e => e.id === selectedEventId); if(!ev) return;
      const stage = ev.stages[eventDetailStage]; if(!stage) return;
      const m = stage.matches.find(x => x.id === inp.dataset.mid); if(!m) return;
      const v = inp.value === '' ? null : parseInt(inp.value);
      if(inp.dataset.side === 'a') m.scoreA = v; else m.scoreB = v;
      await saveShared('brcsgo:events', events);
    });
  });

  // set-winner buttons
  document.querySelectorAll('[data-set-winner]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const ev = events.find(e => e.id === selectedEventId); if(!ev) return;
      const stage = ev.stages[eventDetailStage]; if(!stage) return;
      const m = stage.matches.find(x => x.id === btn.dataset.setWinner); if(!m) return;
      m.winner = btn.dataset.side; // 'a', 'b', or 'd'
      if(ev.status === 'upcoming') ev.status = 'live';
      await saveShared('brcsgo:events', events);
      renderTab();
    });
  });
  document.querySelectorAll('[data-clear-winner]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const ev = events.find(e => e.id === selectedEventId); if(!ev) return;
      const stage = ev.stages[eventDetailStage]; if(!stage) return;
      const m = stage.matches.find(x => x.id === btn.dataset.clearWinner); if(!m) return;
      m.winner = null;
      await saveShared('brcsgo:events', events);
      renderTab();
    });
  });

  // modal
  const overlay = document.getElementById('eventModalOverlay');
  if(overlay){
    overlay.addEventListener('click', (e) => { if(e.target === overlay) closeEventModal(); });
    const closeBtn = document.getElementById('btnCloseModal'); if(closeBtn) closeBtn.addEventListener('click', closeEventModal);
    const cancelBtn = document.getElementById('btnCancelEvent'); if(cancelBtn) cancelBtn.addEventListener('click', closeEventModal);
    const saveBtn = document.getElementById('btnSaveEvent'); if(saveBtn) saveBtn.addEventListener('click', saveNewEvent);
    document.querySelectorAll('[data-fmt-cb]').forEach(cb => {
      cb.addEventListener('change', () => {
        eventModalDraft.format[cb.dataset.fmtCb] = cb.checked;
        cb.closest('.fmt-chip').classList.toggle('on', cb.checked);
      });
    });
  }
}

  for(const m of list){
    const img = document.getElementById('proof-' + m.id);
    const dl = document.getElementById('dl-' + m.id);
    if(!img) continue;
    try{
      const val = await getDoc('brcsgo:proof:' + m.id);
      if(val){ img.src = val; if(dl) dl.href = val; }
    }catch(e){ /* sem imagem disponível */ }

function attachTabEvents(){
  attachEventosEvents();
  const claimBtn = document.getElementById('claimBtn');
  if(claimBtn){
    claimBtn.addEventListener('click', async () => {
      const oldId = document.getElementById('claimSelect').value;
      const oldPlayer = players.find(p => p.id === oldId);
      if(!oldPlayer) return;
      if(!confirm(`Isso vai transferir TODO o histórico de "${oldPlayer.name}" pra sua conta atual, e não pode ser desfeito. Continuar?`)) return;
      claimBtn.disabled = true;
      matches.forEach(m => { if(m.playerId === oldId) m.playerId = currentPlayerId; });
      players = players.filter(p => p.id !== oldId);
      await saveShared('brcsgo:matches', matches);
      await saveShared('brcsgo:players', players);
      showToast('Histórico antigo transferido com sucesso!');
      renderTab();
    });
  }

  const modeSelect = document.getElementById('f_mode');
  if(modeSelect){
    modeSelect.addEventListener('change', () => updateFormForMode(modeSelect.value));
  }

  attachModAndActionEvents();

  const form = document.getElementById('matchForm');
  if(form){
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = userProfile.playerName;
      const file = document.getElementById('f_proof').files[0];
      if(!file){ alert('Anexe um print do placar final da partida.'); return; }

      const modeKey = document.getElementById('f_mode').value;
      const cfg = MODES[modeKey];
      const kills = parseInt(document.getElementById('f_kills').value) || 0;
      const deaths = parseInt(document.getElementById('f_deaths').value) || 0;
      const assists = cfg.fields.includes('assists') ? (parseInt(document.getElementById('f_assists').value) || 0) : 0;
      const pontos = cfg.fields.includes('pontos') ? (parseInt(document.getElementById('f_pontos').value) || 0) : 0;
      const mvps = cfg.fields.includes('mvps') ? (parseInt(document.getElementById('f_mvps').value) || 0) : 0;
      const result = cfg.hasResultado ? document.getElementById('f_result').value : null;

      const match = {
        id: 'm_' + Date.now() + '_' + Math.floor(Math.random()*1000),
        playerId: currentPlayerId,
        mode: modeKey,
        date: document.getElementById('f_date').value,
        map: document.getElementById('f_map').value,
        result, kills, deaths, assists, pontos, mvps,
        status: 'pendente',
        correctedByAI: false,
        aiNote: '',
        createdAt: Date.now()
      };

      // Salva e libera o jogador NA HORA — a verificação por IA roda depois, em segundo plano
      matches.push(match);
      await saveShared('brcsgo:matches', matches);
      viewMode = modeKey;
      lastUsedMode = modeKey;
      lastUsedMap = match.map;
      await saveLocal('brcsgo:lastMode', modeKey);
      await saveLocal('brcsgo:lastMap', match.map);

      showToast('Partida enviada! Verificando em segundo plano...');
      activeTab = 'perfil';
      render();

      verifyMatchInBackground(match.id, name, modeKey, file);
    });
  }
}

async function verifyMatchInBackground(matchId, playerName, modeKey, file){
  const cfg = MODES[modeKey];
  let proofData = null;
  try{ proofData = await compressImage(file); }catch(err){ console.error(err); }
  if(proofData){
    try{ await setDoc('brcsgo:proof:' + matchId, proofData); }catch(err){}
  }
  if(!proofData) { renderTab(); return; }

  const ai = await analyzeProof(proofData, playerName, modeKey);

  // recarrega o estado mais recente do banco, pra não sobrescrever uma decisão
  // que um moderador já possa ter tomado manualmente enquanto a IA processava
  const freshMatches = await loadShared('brcsgo:matches');
  const idx = freshMatches.findIndex(m => m.id === matchId);
  if(idx === -1) return;
  const match = freshMatches[idx];
  if(match.status !== 'pendente') return;

  if(!ai || ai.legivel === false){
    match.aiNote = 'A IA não conseguiu confirmar os dados no print — revisão manual necessária.' + (ai && ai.observacao ? ' (' + ai.observacao + ')' : '');
  } else {
    const diffs = [];
    ['kills','deaths','assists','pontos','mvps'].forEach(f => {
      if(!cfg.fields.includes(f)) return;
      if(ai[f] !== null && ai[f] !== undefined && Number(ai[f]) !== match[f]){
        diffs.push({field:f, from:match[f], to:Number(ai[f])});
      }
    });
    if(cfg.hasResultado && ai.resultado){
      const aiResult = normalizeResultado(ai.resultado);
      if(aiResult && aiResult !== match.result) diffs.push({field:'result', from:match.result, to:aiResult});
    }
    if(ai.mapa){
      const aiMap = matchMap(ai.mapa);
      if(aiMap && aiMap !== match.map) diffs.push({field:'map', from:match.map, to:aiMap});
    }
    let modeWarning = '';
    if(ai.modo){
      const aiMode = matchMode(ai.modo);
      if(aiMode && aiMode !== modeKey){
        modeWarning = 'O print parece ser de ' + MODES[aiMode].label + ', mas a partida foi registrada como ' + MODES[modeKey].label + ' — confira antes de aprovar.';
      }
    }

    if(diffs.length === 0 && !modeWarning){
      match.status = 'aprovada';
      match.aiNote = 'IA confirmou todas as estatísticas do print.';
      deleteDoc('brcsgo:proof:' + matchId);
    } else {
      diffs.forEach(d => { match[d.field] = d.to; });
      match.correctedByAI = diffs.length > 0;
      const notes = [];
      if(diffs.length) notes.push('IA ajustou valores divergentes do print: ' + diffs.map(d => FIELD_LABELS[d.field] + ' ' + d.from + ' → ' + d.to).join(', '));
      if(modeWarning) notes.push('⚠ ' + modeWarning);
      match.aiNote = notes.join(' ');
    }
  }

  freshMatches[idx] = match;
  await saveShared('brcsgo:matches', freshMatches);
  matches = freshMatches;
  renderTab();
}

function attachModAndActionEvents(){
  const histSel = document.getElementById('histPlayer');
  if(histSel) histSel.addEventListener('change', () => { histPlayerId = histSel.value; renderTab(); });
  document.querySelectorAll('[data-remove-match]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if(!(userProfile && userProfile.role === 'moderator')) return;
      const lg = (document.documentElement.lang || 'pt').slice(0,2);
      const msg = {
        pt: 'Remover esta partida aprovada do histórico? O ELO do jogador será recalculado e isso não pode ser desfeito.',
        en: "Remove this approved match from the history? The player's ELO will be recalculated and this can't be undone.",
        es: '¿Eliminar esta partida aprobada del historial? El ELO del jugador se recalculará y no se puede deshacer.'
      }[lg];
      if(!confirm(msg)) return;
      const id = btn.dataset.removeMatch;
      const idx = matches.findIndex(m => m.id === id);
      if(idx < 0) return;
      matches.splice(idx, 1);
      await saveShared('brcsgo:matches', matches);
      deleteDoc('brcsgo:proof:' + id);
      showToast({pt:'Partida removida do histórico.', en:'Match removed from history.', es:'Partida eliminada del historial.'}[lg]);
      renderTab();
    });
  });
  document.querySelectorAll('[data-approve]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.approve;
      const m = matches.find(m => m.id === id);
      if(m) m.status = 'aprovada';
      await saveShared('brcsgo:matches', matches);
      deleteDoc('brcsgo:proof:' + id);
      renderTab();
    });
  });
  document.querySelectorAll('[data-reject]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if(!confirm('Rejeitar esta partida?')) return;
      const id = btn.dataset.reject;
      const m = matches.find(m => m.id === id);
      if(m) m.status = 'rejeitada';
      await saveShared('brcsgo:matches', matches);
      deleteDoc('brcsgo:proof:' + id);
      renderTab();
    });
  });
}

async function init(){
  if(!db){
    storageAvailable = false;
  }
  let auth = null;
  try{ if(typeof firebase !== 'undefined') auth = firebase.auth(); }catch(e){}
  if(!auth){
    document.getElementById('app').innerHTML = '<div class="storage-warning">⚠ O sistema de login (Firebase Authentication) não pôde ser iniciado. Confira se ele está ativado no seu projeto Firebase (Build → Authentication → Sign-in method → Email/Senha).</div>';
    return;
  }

  const lastMode = await loadLocal('brcsgo:lastMode');
  if(lastMode && MODES[lastMode]) lastUsedMode = lastMode;
  const lastMap = await loadLocal('brcsgo:lastMap');
  if(lastMap && MAPS.includes(lastMap)) lastUsedMap = lastMap;

  auth.onAuthStateChanged(async (user) => {
    if(!user){
      authUser = null;
      userProfile = null;
      renderAuthGate();
      return;
    }
    authUser = user;
    players = await loadShared('brcsgo:players');
    matches = await loadShared('brcsgo:matches');
    users = await loadShared('brcsgo:users');
    events = await loadShared('brcsgo:events');
    if(!Array.isArray(events)) events = [];
    try{ const seen = localStorage.getItem('brcsgo:seenEvents:'+user.uid); seenEventIds = seen ? JSON.parse(seen) : []; }catch(e){ seenEventIds = []; }
    matches.forEach(m => {
      if(!m.status) m.status = 'aprovada';
      if(!m.mode) m.mode = 'competitivo';
      if(m.pontos === undefined) m.pontos = (m.kills||0) * 2;
    });
    userProfile = users.find(u => u.uid === user.uid) || null;
    if(!userProfile){
      // conta existe na autenticação (ex: primeiro login via Google/GitHub) mas ainda não escolheu um nick
      currentPlayerId = null;
      renderProfileSetupGate();
      return;
    }
    currentPlayerId = user.uid;
    if(activeTab === 'moderacao' && userProfile.role !== 'moderator') activeTab = 'ranking';
    render();
  });
}

    if(event.clientX < bounds.left || event.clientX > bounds.right || event.clientY < bounds.top || event.clientY > bounds.bottom) return;
    element.style.setProperty('--mx', ((event.clientX - bounds.left) / bounds.width * 100) + '%');
    element.style.setProperty('--my', ((event.clientY - bounds.top) / bounds.height * 100) + '%');
    element.style.setProperty('--px', ((event.clientX - bounds.left) / bounds.width * 100) + '%');

  });
}, {passive:true});

    parts.forEach(function(r,i){ var o = ctx.createOscillator(), g = ctx.createGain(), dd = d/(1+i*0.8); o.type = 'sine'; o.frequency.value = f*r; env(g,t,0.002,dd,pk/(1+i*0.7)); o.connect(g); out(g,0.15,sL||0.3); o.start(t); o.stop(t+dd+0.1); }); }
  // whoosh de ar (ruído com varredura de frequência)
  function whoosh(f0,f1,d,pk,w,q){ if(!ok()) return; var t = T(w), n = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), g = ctx.createGain();
    n.buffer = noiseBuf; n.loop = true; bp.type = 'bandpass'; bp.Q.value = q||0.9; bp.frequency.setValueAtTime(f0,t); bp.frequency.exponentialRampToValueAtTime(f1,t+d);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(pk,t+d*0.45); g.gain.exponentialRampToValueAtTime(0.0001,t+d); n.connect(bp); bp.connect(g); out(g,0.1,0.3); n.start(t); n.stop(t+d+0.05); }
  // chiado pneumático (liberação de ar de pistão)
  function hiss(d,pk,w){ hit('highpass',5200,0.7,d,pk,w); }
  // splash: massa de ruído larga que despenca em frequência + corpo grave
  function splash(pk,w){ if(!ok()) return; var t = T(w), n = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), g = ctx.createGain();
    n.buffer = noiseBuf; bp.type = 'bandpass'; bp.Q.value = 0.45; bp.frequency.setValueAtTime(7000,t); bp.frequency.exponentialRampToValueAtTime(1100,t+0.8);
    env(g,t,0.006,0.8,pk); n.connect(bp); bp.connect(g); out(g,0.2,0.5); n.start(t); n.stop(t+0.95); hit('lowpass',500,1,0.35,pk*0.8,w); }
  // pop mecânico (válvula/rolha pesada)
  function pop(f,pk,w){ body(f,f*0.3,0.1,pk,w); hit('bandpass',f*5,2,0.02,pk*0.5,w); }
  // "ka-chunk" de cofre/trava de aço
  function chunk(pk,w){ body(95,40,0.3,pk,w); hit('bandpass',900,1.5,0.06,pk*0.7,w); ring(140,0.45,pk*0.35,w,0.3,[1,2.76,5.4]); }
  // catraca de engrenagem acelerando
  function ratchet(n,t0,t1,pk,f){ for(var i=0;i<n;i++){ var x = i/n, t = t0+(t1-t0)*(1-Math.pow(1-x,1.7)), k = pk*(0.5+x);
    hit('bandpass',f*(0.9+0.2*((i*7)%5)/5),3,0.02,k,t); body(200,110,0.04,k*0.6,t); } }
  function rumble(d,pk,w,lp,rise){ if(!ok()) return null; var t = T(w), n = ctx.createBufferSource(), fl = ctx.createBiquadFilter(), g = ctx.createGain();
    n.buffer = noiseBuf; n.loop = true; fl.type = 'lowpass'; fl.frequency.value = lp||90; g.gain.setValueAtTime(0.0001,t);
    if(rise){ g.gain.exponentialRampToValueAtTime(pk,t+d); } else { g.gain.exponentialRampToValueAtTime(pk,t+d*0.15); g.gain.exponentialRampToValueAtTime(0.0001,t+d); }
    n.connect(fl); fl.connect(g); out(g,0,0.3); n.start(t); n.stop(t+d+0.2); return {g:g}; }
  function startDrone(){ if(drone || !ok()) return; var bg = ctx.createGain(); bg.gain.value = 1; bg.connect(master); bus = bg;
    rumble(9,0.45,0,170,true);
    var t = 0; while(t < 8.3){ var k = t/8.3, pk = 0.32+0.58*k; body(78+k*30,32,0.3,pk,t); hit('lowpass',320,1,0.1,0.25+0.3*k,t); body(66,30,0.2,pk*0.6,t+0.13); t += 0.95-0.68*k; }
    ratchet(28,2.0,8.2,0.13,2600);
    bus = null; drone = {g:bg}; }
  function stopDrone(f){ if(!drone || !ctx) return; var t = ctx.currentTime, d = drone; drone = null; f = f||0.5;
    d.g.gain.cancelScheduledValues(t); d.g.gain.setValueAtTime(Math.max(d.g.gain.value,0.0001),t); d.g.gain.exponentialRampToValueAtTime(0.0001,t+f); }

  var A = {
    click:function(){ hit('bandpass',2800,2.5,0.022,0.2,0); body(170,75,0.09,0.32,0); },
    nav:function(){ body(145,58,0.12,0.42,0); hit('bandpass',1900,2,0.03,0.22,0); hit('bandpass',3600,3,0.018,0.14,0.05); whoosh(160,900,0.22,0.05,0.02,0.8); },
    confirm:function(){ body(118,44,0.2,0.6,0); hit('bandpass',2200,2,0.035,0.28,0); ring(300,0.3,0.1,0.01,0.25,[1,2.76,5.4]); hit('bandpass',3800,3,0.02,0.18,0.07); body(160,70,0.08,0.25,0.07); },
    ok:function(){ A.confirm(); ring(210,0.5,0.1,0.05,0.4,[1,2.76,5.4]); },
    back:function(){ body(100,48,0.14,0.38,0); hit('bandpass',1500,2,0.03,0.2,0); },
    hover:function(){ hit('bandpass',4200,4,0.012,0.05,0); },
    tick:function(){ hit('bandpass',3000,3,0.016,0.16,0); hit('bandpass',2400,3,0.016,0.14,0.04); body(190,100,0.05,0.18,0); },
    open:function(){ whoosh(140,1100,0.32,0.18,0,0.9); body(92,40,0.28,0.55,0.05); ring(230,0.35,0.07,0.06,0.3); },
    close:function(){ whoosh(1000,120,0.28,0.14,0); body(110,50,0.16,0.35,0.18); },
    notify:function(){ ring(440,0.38,0.12,0,0.35,[1,2.76,5.4]); body(115,50,0.16,0.4,0); hit('bandpass',2600,2,0.02,0.15,0); },
    error:function(){ body(72,30,0.4,0.75,0); hit('lowpass',520,1,0.22,0.5,0); body(68,30,0.34,0.6,0.13); ratchet(5,0.02,0.2,0.1,1800); },
    warn:function(){ body(82,36,0.3,0.65,0); hit('lowpass',600,1,0.14,0.4,0); ring(150,0.3,0.06,0,0.2,[1,2.4]); },
    levelup:function(){ body(112,40,0.34,0.85,0); hit('bandpass',2100,2,0.04,0.3,0); ring(262,0.8,0.18,0,0.5); body(150,60,0.12,0.4,0.11); hit('bandpass',3400,3,0.025,0.25,0.11); ring(392,0.6,0.14,0.11,0.5); whoosh(120,1400,0.4,0.12,0.02,0.8); rumble(0.7,0.22,0,110); },
    intro:function(){ whoosh(70,1200,1.4,0.4,0,0.7); body(70,28,1.7,0.85,0.04,0.4); hit('lowpass',260,1,1.0,0.5,0.04,0.4); hiss(0.5,0.25,0.3); chunk(0.7,1.0); chunk(0.5,1.06); startDrone(); },
    step:function(i){ i = i||0; body(170-i*5,38,0.4,0.9,0); hit('lowpass',400,1,0.14,0.45,0); ring(150+i*26,0.65,0.16+i*0.01,0.01,0.45,[1,2.76,5.4,8.93]); pop(260,0.42,0.06); hiss(0.2,0.12+i*0.012,0.02); whoosh(120,900+i*220,0.34,0.14+i*0.012,0,0.9); ratchet(3,0.02,0.1,0.14,2400); if(i>=4) splash(0.16+i*0.02,0.05); if(i>=8) body(60,26,0.6,0.5,0.08,0.3); },
    riser:function(){ ratchet(16,0,0.95,0.2,2200); whoosh(100,6500,0.95,0.5,0,0.7); rumble(0.95,0.55,0,260,true); body(80,34,0.3,0.5,0.35); body(84,34,0.3,0.6,0.6); body(90,34,0.3,0.75,0.8); hiss(0.9,0.18,0.05); },
    slam:function(){ stopDrone(0.8); body(120,20,3.0,1.0,0,0.5); body(70,18,3.2,0.9,0.03,0.5); hit('lowpass',600,1,1.8,0.9,0,0.6); ring(98,2.8,0.3,0,0.8,[1,2.76,5.4,8.93,11.3]); ring(49,3.4,0.3,0,0.9,[1,2.1,3.7,5.2]); ring(196,2.2,0.2,0.01,0.8); chunk(0.9,0); chunk(0.7,0.09); splash(0.7,0.02); hit('highpass',3000,1,0.2,0.4,0); hiss(1.2,0.35,0.05); whoosh(7000,140,1.2,0.4,0.02,0.7); rumble(3,0.65,0,100); body(90,30,0.5,0.45,0.55,0.3); body(80,28,0.5,0.35,0.9,0.3); ring(320,0.4,0.1,0.35,0.5); ring(240,0.5,0.08,0.7,0.5); },
    reveal:function(){ chunk(0.6,0); ring(330,1.6,0.14,0.02,0.9,[1,2.76,5.4]); pop(300,0.4,0.1); hiss(0.4,0.15,0.1); whoosh(150,1800,0.6,0.1,0,0.8); body(100,45,0.4,0.5,0.05,0.3); },
    out:function(){ whoosh(1800,100,0.7,0.2,0); body(100,45,0.2,0.4,0.25); hiss(0.4,0.12,0.1); }
  };
  window.SFX = {
    enabled:function(){ return on; },
    toggle:function(){ on = !on; try{ localStorage.setItem('brcsgo:cs10sound', on?'1':'0'); }catch(e){} sync(); if(on) A.confirm(); return on; },
    play:function(n,a){ if(on && A[n]){ try{ A[n](a); }catch(e){} } },
    stopDrone:stopDrone
  };

  // ---- botão de som ----
  var tgl = document.createElement('button'); tgl.type = 'button'; tgl.className = 'sfx'; tgl.setAttribute('aria-label','Som'); tgl.title = 'Som / Sound';
  function sync(){ tgl.textContent = on ? '🔊' : '🔇'; var b = document.querySelector('.cs10-snd'); if(b) b.textContent = on ? '🔊' : '🔇'; }
  tgl.addEventListener('click', function(e){ e.stopPropagation(); window.SFX.toggle(); });
  (document.querySelector('.lang-switch') || document.body).appendChild(tgl); sync();

  // ---- sons de interface (delegados) ----
  var DANGER = /rejeit|exclu|remov|reject|delete|remove|eliminar|sair|log out|salir/i;
  function ui(n){ var now = Date.now(); if(now - lastUi < 25) return; lastUi = now; window.SFX.play(n); }
  document.addEventListener('click', function(e){
    var b = e.target.closest && e.target.closest('button,.tab-btn,.dock-btn,.mode-chip,.event-card,[data-tab],[data-region],a');
    if(!b || b.closest('.cs10,.lvlup') || b.classList.contains('sfx')) return;
    if(b.matches('.ok,[data-approve]')) return ui('ok');
    if(b.matches('.danger,[data-reject],[data-remove-match]') || (b.tagName === 'BUTTON' && DANGER.test(b.textContent||''))) return ui('warn');
    if(b.matches('.tab-btn,.dock-btn,.mode-chip,[data-tab],[data-region]')) return ui('nav');
    if(b.matches('.primary,[type=submit]')) return ui('confirm');
    if(/voltar|back|cancel|fechar|close|×/i.test(b.textContent||'')) return ui('back');
    ui('click');
  }, true);
  document.addEventListener('change', function(e){ var t = e.target; if(t && /^(SELECT|INPUT)$/.test(t.tagName) && t.type !== 'text' && t.type !== 'password' && t.type !== 'email') ui('tick'); }, true);
  document.addEventListener('mouseover', function(e){
    var b = e.target.closest && e.target.closest('.tab-btn,.dock-btn,.mode-chip,.event-card,button.primary'); if(!b || (e.relatedTarget && b.contains(e.relatedTarget))) return;
    var now = Date.now(); if(now - lastHover < 90) return; lastHover = now; window.SFX.play('hover');
  }, true);
  new MutationObserver(function(ms){
    ms.forEach(function(m){
      m.addedNodes.forEach(function(n){
        if(n.nodeType !== 1 || (n.closest && n.closest('.cs10,.lvlup,.lang-switch'))) return;
        if(n.id === 'toast'){ window.SFX.play(/erro|não foi|inválid|incorret|falh|muitas|escolha|digite|use |informe|anexe|envie|selecione|error|invalid|wrong|failed/i.test(n.textContent) ? 'error' : 'notify'); }
        else if(n.classList.contains('modal-overlay') || n.querySelector('.modal-overlay')) window.SFX.play('open');
        else if(n.matches('.helper-note[style*="--red"]') || n.querySelector('.helper-note[style*="--red"]')) window.SFX.play('error');
      });
      m.removedNodes.forEach(function(n){ if(n.nodeType === 1 && n.classList && n.classList.contains('modal-overlay')) window.SFX.play('close'); });
    });
  }).observe(document.body,{childList:true,subtree:true});
})();

<script>
// ====== Cutscene cinematográfica — chegada ao Nível 10 ======
(function(){
  var active = false;
  var TXT = {
    pt:{up:'Subiu de nível!', reach:'Nível alcançado', lv:'NÍVEL', done:'Nível 10 alcançado', elo:'ELO', go:'Continuar', skip:'Pular ›', ch:'Challenger — Top 1000 da região', sub:'Você está entre a elite do BRCS2'},
    en:{up:'Level up!', reach:'Level reached', lv:'LEVEL', done:'Level 10 reached', elo:'ELO', go:'Continue', skip:'Skip ›', ch:'Challenger — Top 1000 of the region', sub:'You are among the BRCS2 elite'},
    es:{up:'¡Subiste de nivel!', reach:'Nivel alcanzado', lv:'NIVEL', done:'Nivel 10 alcanzado', elo:'ELO', go:'Continuar', skip:'Saltar ›', ch:'Challenger — Top 1000 de la región', sub:'Estás en la élite de BRCS2'}
  };
  function L(){ var k=(document.documentElement.lang||'pt').slice(0,2); return TXT[k]||TXT.pt; }
  var S = window.SFX;
  function stopDrone(f){ S.stopDrone(f); }
  function sfxIntro(){ S.play('intro'); }
  function sfxStep(i){ S.play('step', i); }
  function sfxRiser(){ S.play('riser'); }
  function sfxSlam(){ S.play('slam'); }
  function sfxReveal(){ S.play('reveal'); }
  function sfxOut(){ S.play('out'); }

  function play(info){
    if(active) return; active = true;
    info = info || {};
    var T = L(), reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    var delays = reduce ? [0,250,250,250,250,250,250,250,250,300] : [0,620,620,620,640,660,700,760,860,1050];
    var el = document.createElement('div'); el.className = 'cs10'; el.setAttribute('role','dialog'); el.setAttribute('aria-live','polite');
    var nodes = LEVELS.map(function(lv,i){ return '<div class="cs10-node" data-i="'+i+'">'+tierIconSVG(lv,44)+'</div>'; }).join('');
    el.innerHTML =
      '<div class="cs10-bar top"></div><div class="cs10-bar bot"></div><div class="cs10-ring"></div>'+
      '<button class="cs10-snd" type="button" aria-label="Som">'+(window.SFX.enabled()?'🔊':'🔇')+'</button>'+
      '<button class="cs10-skip" type="button">'+T.skip+'</button>'+
      '<div class="cs10-stage">'+
        '<div class="cs10-kicker">'+(info.mode||'')+(info.name?' · '+info.name:'')+'</div>'+
        '<div class="cs10-iconwrap"><div class="cs10-icon"></div></div>'+
        '<div class="cs10-title"></div>'+
        '<div class="cs10-track"><div class="cs10-rail"><div class="cs10-fill"></div></div><div class="cs10-nodes">'+nodes+'</div></div>'+
        '<div class="cs10-final"><h3>'+T.done+'</h3><p><b>'+(info.elo||'')+' '+T.elo+'</b>'+(info.region?' · '+info.region:'')+'<br>'+(info.challenger?T.ch:T.sub)+'</p><button class="cs10-go" type="button">'+T.go+'</button></div>'+
      '</div><div class="cs10-flash"></div>';
    document.body.appendChild(el);
    sfxIntro();
    var prevOverflow = document.body.style.overflow; document.body.style.overflow = 'hidden';
    var icon = el.querySelector('.cs10-icon'), title = el.querySelector('.cs10-title'), fill = el.querySelector('.cs10-fill'), nodeEls = el.querySelectorAll('.cs10-node');
    var timers = [], closed = false;
    function later(fn,ms){ timers.push(setTimeout(fn,ms)); }
    function setLevel(i){
      var lv = LEVELS[i];
      el.style.setProperty('--c', lv.color);
      icon.innerHTML = tierIconSVG(lv,170); icon.classList.remove('pop'); void icon.offsetWidth; icon.classList.add('pop');
      title.textContent = T.lv+' '+lv.level;
      fill.style.transitionDuration = (delays[i]||300)+'ms,400ms';
      fill.style.width = (i/(LEVELS.length-1)*100)+'%';
      nodeEls.forEach(function(n,k){ n.classList.toggle('lit',k<=i); n.classList.toggle('cur',k===i); });
      sfxStep(i); if(i === 9) sfxRiser();
    }
    function close(){
      if(closed) return; closed = true; timers.forEach(clearTimeout); stopDrone(0.4); sfxOut();
      el.classList.add('out'); el.classList.remove('on');
      setTimeout(function(){ el.remove(); document.body.style.overflow = prevOverflow; active = false; document.removeEventListener('keydown',onKey); }, 750);
    }
    function onKey(e){ if(e.key==='Escape'||(e.key==='Enter'&&el.classList.contains('done'))) close(); }
    document.addEventListener('keydown', onKey);
    el.querySelector('.cs10-skip').onclick = close;
    el.querySelector('.cs10-go').onclick = function(){ S.play('confirm'); close(); };
    el.querySelector('.cs10-snd').onclick = function(e){
      e.currentTarget.textContent = window.SFX.toggle() ? '🔊' : '🔇';
    };
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ el.classList.add('on'); }); });
    var t = reduce ? 500 : 1500;
    LEVELS.forEach(function(lv,i){
      t += delays[i];
      (function(i){ later(function(){ if(!closed) setLevel(i); }, t); })(i);
    });
    // clímax no Nível 10
    later(function(){ if(closed) return; el.classList.add('slam'); sfxSlam(); }, t + (reduce?200:750));
    later(function(){ if(!closed){ el.classList.add('done'); sfxReveal(); } }, t + (reduce?500:1900));
  }
  // ---- popup verde de subida de nível ----
  var upTimer = null, upEl = null;
  function sfxLevelUp(){ S.play('levelup'); }
  function levelUpPopup(info){
    info = info || {}; var T = L(), lv = LEVELS[Math.max(0,Math.min(9,(info.level||1)-1))];
    if(upEl){ upEl.remove(); clearTimeout(upTimer); }
    var el = document.createElement('div'); upEl = el; el.className = 'lvlup'; el.setAttribute('role','status'); el.setAttribute('aria-live','polite');
    el.innerHTML = tierIconSVG(lv,48)+'<div><b>▲ '+T.up+'</b><span>'+T.lv+' '+lv.level+'</span>'+(info.elo?'<small>'+info.elo+' '+T.elo+(info.mode?' · '+info.mode:'')+'</small>':'')+'</div>';
    document.body.appendChild(el);
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ el.classList.add('on'); }); });
    sfxLevelUp();
    upTimer = setTimeout(function(){ el.classList.remove('on'); setTimeout(function(){ el.remove(); if(upEl===el) upEl=null; }, 600); }, 4000);
  }
  window.playLevelUpPopup = function(n){ levelUpPopup({level:n||4, elo:1000, mode:'Competitivo'}); };

  window.playLevel10Cutscene = play;

  // ---- gatilho: detecta a subida para o Nível 10 do jogador logado ----
  var readyAt = 0;
  function check(){
    try{
      if(active || typeof authUser === 'undefined' || !authUser || !currentPlayerId || !players.length || !matches.length) { readyAt = 0; return; }
      if(!readyAt){ readyAt = Date.now(); return; }
      if(Date.now() - readyAt < 2500) return;            // espera os dados terminarem de carregar
      var p = players.find(function(x){ return x.id === currentPlayerId; }); if(!p) return;
      Object.keys(MODES).forEach(function(mode){
        if(active || !MODES[mode].hasPatente) return;
        var st = computeModeStats(p.id, mode), lvl = st.calibrating ? 0 : getTier(st.elo).level;
        var key = 'brcsgo:lvlseen:'+authUser.uid+':'+mode, seen = null;
        try{ seen = localStorage.getItem(key); }catch(e){}
        try{ localStorage.setItem(key, String(lvl)); }catch(e){}
        if(seen !== null && Number(seen) < 10 && lvl >= 10){
          var tier = playerTier(p, st, mode);
          play({mode: MODES[mode].label, name: p.name, elo: st.elo, region: p.region || '', challenger: !!tier.challenger});
        } else if(seen !== null && lvl > Number(seen) && lvl < 10){
          levelUpPopup({level: lvl, elo: st.elo, mode: MODES[mode].label});   // subiu de nível (inclui sair da calibragem)
        }
      });
    }catch(e){}
  }
  setInterval(check, 1200);
  // pré-visualização: abra o site com #cutscene10 no final do endereço (ou use playLevel10Cutscene() no console)
  function preview(){ if(location.hash === '#levelup'){ window.playLevelUpPopup(4); history.replaceState(null,'',location.pathname+location.search); } if(location.hash === '#cutscene10'){ var n=document.querySelector('.name-cell'); play({mode:'Competitivo', name:(typeof userProfile!=='undefined'&&userProfile&&userProfile.playerName)||'Player', elo:2034, region:'', challenger:false}); history.replaceState(null,'',location.pathname+location.search); } }
  window.addEventListener('hashchange', preview); setTimeout(preview, 2500);
})();
</script>
