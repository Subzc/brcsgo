<title>BRCS2 — Counter-Strike 2 · Partidas &amp; Ranking</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpolygon points='50,5 95,27 95,73 50,95 5,73 5,27' fill='%23E5262B'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
  :root{
    --black:#05060C;
    --black-2:#080A14;
    --panel:#0F1122;
    --panel2:#151832;
    --panel3:#1E2143;
    --line: rgba(255,255,255,0.08);
    --line-strong: rgba(255,255,255,0.18);
    --white:#F3F1FA;
    --muted:#9096B8;
    --muted-2:#5A5F82;
    --orange:#E5262B;
    --orange-2:#FFB27A;
    --orange-soft: rgba(229,38,43,0.14);
    --blue:#9A9AA3;
    --blue-deep:#6B0F12;
    --blue-soft: rgba(255,255,255,0.14);
    --purple:#B3151A;
    --purple-2:#B48CFF;
    --purple-soft: rgba(229,38,43,0.16);
    --red:#EB4B6B;
    --red-soft: rgba(235,75,107,0.14);
    --grad-orange: linear-gradient(135deg,#FF9147 0%,#FF5B1F 55%,#E23F8E 100%);
    --grad-cosmic: linear-gradient(135deg,#9A9AA3 0%,#B3151A 55%,#E5262B 120%);
    --grad-panel: linear-gradient(180deg, rgba(180,140,255,0.06), rgba(255,255,255,0) 60%);
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.5);
    --shadow-md: 0 10px 30px -12px rgba(0,0,0,0.7), 0 2px 8px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.04);
    --shadow-glow: 0 0 0 1px rgba(229,38,43,0.35), 0 12px 44px -12px rgba(229,38,43,0.4);
  }
  *{box-sizing:border-box;}
  html,body{ min-height:100%; }
  body{
    margin:0;
    color: var(--white);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    background:
      radial-gradient(1100px 700px at 88% -12%, rgba(229,38,43,0.16), transparent 60%),
      radial-gradient(1000px 700px at -10% 15%, rgba(255,255,255,0.16), transparent 60%),
      radial-gradient(900px 800px at 50% 110%, rgba(229,38,43,0.22), transparent 60%),
      radial-gradient(600px 500px at 20% 80%, rgba(229,38,43,0.10), transparent 60%),
      linear-gradient(180deg, #070818 0%, #05060C 60%, #06081A 100%);
    background-attachment: fixed;
    position:relative;
    overflow-x:hidden;
  }
  /* Grid + noise + aurora layers */
  body::before{
    content:""; position:fixed; inset:-2px; pointer-events:none; z-index:0;
    background-image:
      linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px);
    background-size: 56px 56px, 56px 56px;
    mask-image: radial-gradient(ellipse 80% 60% at 50% 30%, #000 40%, transparent 90%);
    -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 30%, #000 40%, transparent 90%);
    opacity:.55;
  }
  body::after{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      conic-gradient(from 210deg at 70% 30%, rgba(229,38,43,0.22), transparent 25%, rgba(229,38,43,0.22) 55%, transparent 80%, rgba(255,255,255,0.20) 100%);
    filter: blur(90px) saturate(1.1);
    opacity:.55;
    animation: auroraShift 22s ease-in-out infinite alternate;
    mix-blend-mode: screen;
  }
  @keyframes auroraShift{
    0%  { transform: translate3d(-2%, -1%, 0) rotate(0deg) scale(1);   }
    50% { transform: translate3d(3%, 2%, 0)  rotate(15deg) scale(1.1); }
    100%{ transform: translate3d(-1%, 3%, 0) rotate(-10deg) scale(1.05);}
  }

  /* ====== Background video de CS (opcional) ======
     Cole a URL de um clipe .mp4 no atributo src do <video id="bgVideo">
     no final do <body>. Enquanto vazio, exibe apenas as camadas animadas
     de gradiente e tracers abaixo. */
  .bg-video{
    position: fixed; inset: 0; width: 100vw; height: 100vh;
    object-fit: cover; z-index: -2; pointer-events: none;
    opacity: 0; transition: opacity 1.2s ease;
    filter: saturate(1.15) contrast(1.05) brightness(0.55) hue-rotate(-8deg);
  }
  .bg-video.is-ready{ opacity: .35; }
  .bg-tint{
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(1200px 800px at 80% 20%, rgba(229,38,43,0.22), transparent 60%),
      radial-gradient(1000px 700px at 15% 80%, rgba(255,255,255,0.22), transparent 60%),
      radial-gradient(900px 900px at 50% 50%, rgba(229,38,43,0.20), transparent 65%),
      linear-gradient(180deg, rgba(5,6,12,0.55) 0%, rgba(5,6,12,0.75) 100%);
  }
  /* Tracers/streaks animados — dinâmicos mesmo sem vídeo */
  .bg-tracers{
    position: fixed; inset:-10%; z-index:-1; pointer-events:none; overflow:hidden;
    opacity:.6; mix-blend-mode: screen;
  }
  .bg-tracers span{
    position:absolute; left:-20%; top:var(--y,20%);
    width:60vw; height:1.5px; transform: rotate(-14deg);
    background: linear-gradient(90deg, transparent, var(--c, #9A9AA3), transparent);
    filter: blur(1px);
    animation: tracerMove var(--d, 9s) linear infinite;
    animation-delay: var(--dl, 0s);
  }
  @keyframes tracerMove{
    0%   { transform: translate3d(-30%, 0, 0) rotate(-14deg); opacity:0; }
    10%  { opacity:.9; }
    100% { transform: translate3d(180%, -30%, 0) rotate(-14deg); opacity:0; }
  }
  @media (prefers-reduced-motion: reduce){
    .bg-tracers span{ animation: none; opacity:.15; }
  }

  h1,h2,h3, .display{
    font-family:'Rajdhani', sans-serif;
    text-transform:uppercase;
    letter-spacing:0.06em;
    margin:0;
  }
  .mono{ font-family:'IBM Plex Mono', monospace; }
  ::selection{ background: var(--orange); color:#0A0A0C; }

  @keyframes fadeIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  @keyframes popIn{ from{opacity:0; transform:scale(.7);} to{opacity:1; transform:scale(1);} }
  @keyframes pulseGlow{ 0%,100%{ box-shadow:0 0 0 rgba(229,38,43,0.25), 0 0 0 rgba(229,38,43,0);} 50%{ box-shadow:0 0 26px rgba(229,38,43,0.6), 0 0 46px rgba(229,38,43,0.35);} }
  @keyframes pillPulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.14);} }
  @keyframes slideUp{ from{opacity:0; transform:translate(-50%,14px);} to{opacity:1; transform:translate(-50%,0);} }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @keyframes shimmer{ 0%{ background-position:-200% 0;} 100%{ background-position:200% 0;} }
  @keyframes borderGlow{ 0%,100%{ background-position:0% 50%;} 50%{ background-position:100% 50%;} }
  @keyframes floaty{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-4px);} }

  .app{ position:relative; z-index:1; max-width:1220px; margin:0 auto; padding:32px 22px 90px; }

  .storage-warning{
    background: linear-gradient(180deg, rgba(235,75,107,0.20), rgba(235,75,107,0.06));
    border:1px solid rgba(235,75,107,0.45);
    color:var(--white);
    padding:14px 18px; font-size:13px; margin-bottom:18px; line-height:1.55;
    border-radius:8px;
    backdrop-filter: blur(10px);
    box-shadow: 0 10px 30px -18px rgba(235,75,107,0.6);
  }

  .header{
    display:flex; align-items:center; justify-content:space-between;
    gap:16px; flex-wrap:wrap;
    padding:24px 26px;
    background:
      radial-gradient(500px 200px at 90% -30%, rgba(229,38,43,0.18), transparent 60%),
      radial-gradient(500px 220px at 0% 130%, rgba(229,38,43,0.22), transparent 60%),
      linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01)),
      var(--panel);
    border:1px solid var(--line);
    margin-bottom:22px;
    border-radius:8px;
    box-shadow: var(--shadow-md), 0 0 60px -30px rgba(229,38,43,0.5);
    position:relative; overflow:hidden;
    backdrop-filter: blur(14px);
  }
  .header::before{
    content:""; position:absolute; left:0; right:0; top:0; height:1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), rgba(229,38,43,0.6), rgba(229,38,43,0.6), transparent);
    background-size: 200% 100%;
    animation: borderGlow 8s linear infinite;
  }
  .header::after{
    content:""; position:absolute; inset:-1px; border-radius:8px; pointer-events:none;
    background: linear-gradient(140deg, rgba(255,255,255,0.14), transparent 30%, transparent 70%, rgba(229,38,43,0.14));
    mix-blend-mode: overlay;
  }
  .brand{ display:flex; align-items:center; gap:16px; position:relative; z-index:1; }
  .brand-mark{
    width:48px; height:48px;
    background: var(--grad-orange);
    clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
    flex-shrink:0;
    animation: pulseGlow 3s ease-in-out infinite, floaty 5s ease-in-out infinite;
    filter: drop-shadow(0 8px 18px rgba(229,38,43,0.45));
  }
  .brand h1{
    font-size:26px;
    background: linear-gradient(90deg, #FFFFFF 0%, #C7B8FF 55%, #FFB27A 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .brand p{ margin:4px 0 0; font-size:11.5px; color:var(--muted); letter-spacing:0.18em; text-transform:uppercase; }

  .header-controls{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; position:relative; z-index:1; }
  select, input, button{
    font-family:'Inter', sans-serif;
    background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0)) , var(--panel2);
    color: var(--white);
    border:1px solid var(--line);
    padding:10px 14px;
    font-size:14px;
    border-radius:10px;
    transition: border-color .2s ease, background .2s ease, transform .12s ease, box-shadow .2s ease;
  }
  select{ min-width:150px; appearance:none;
    background-image: linear-gradient(45deg, transparent 50%, var(--purple-2) 50%), linear-gradient(135deg, var(--purple-2) 50%, transparent 50%), linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0)), var(--panel2);
    background-position: calc(100% - 16px) 55%, calc(100% - 11px) 55%, 0 0, 0 0;
    background-size: 5px 5px, 5px 5px, 100% 100%, 100% 100%; background-repeat:no-repeat; padding-right:34px;
  }
  input:hover, select:hover{ border-color: var(--line-strong); }
  input:focus, select:focus{ outline:none; border-color: var(--purple-2); box-shadow: 0 0 0 3px rgba(229,38,43,0.22); }
  button{
    cursor:pointer;
    background: var(--grad-orange);
    color:#0A0A0C;
    font-weight:700;
    border:none;
    text-transform:uppercase;
    letter-spacing:0.05em;
    font-size:13px;
    border-radius:10px;
    box-shadow: 0 6px 18px -6px rgba(229,38,43,0.6), inset 0 1px 0 rgba(255,255,255,0.3);
  }
  button:hover:not(:disabled){ transform: translateY(-1px); filter:brightness(1.07); box-shadow: 0 10px 26px -8px rgba(229,38,43,0.8), inset 0 1px 0 rgba(255,255,255,0.35); }
  button:active:not(:disabled){ transform: translateY(0); filter:brightness(0.98); }
  button:disabled{ opacity:0.5; cursor:wait; box-shadow:none; }
  button:focus-visible{ outline:2px solid var(--purple-2); outline-offset:2px; }
  button.secondary{
    background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0)), var(--panel2);
    color: var(--white); border:1px solid var(--line-strong);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
  }
  button.secondary:hover:not(:disabled){ background: linear-gradient(180deg, rgba(229,38,43,0.14), rgba(255,255,255,0)), var(--panel3); border-color: rgba(229,38,43,0.4); }
  button.danger{ background: linear-gradient(135deg,#EB4B6B,#B92E52); color:#fff; box-shadow: 0 6px 18px -6px rgba(235,75,107,0.65), inset 0 1px 0 rgba(255,255,255,0.2); }
  button.ok{ background: linear-gradient(135deg,#9A9AA3,#6B0F12); color:#fff; box-shadow: 0 6px 18px -6px rgba(255,255,255,0.65), inset 0 1px 0 rgba(255,255,255,0.2); }
  button.small{ padding:7px 12px; font-size:11px; border-radius:8px; }

  .mode-chips{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
  .mode-chip{
    background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0)), var(--panel);
    color:var(--muted); border:1px solid var(--line);
    padding:9px 16px; font-size:12px; font-family:'Rajdhani',sans-serif; font-weight:600;
    text-transform:uppercase; letter-spacing:0.07em; cursor:pointer;
    border-radius:999px;
    transition: color .2s ease, background .2s ease, border-color .2s ease, transform .15s ease, box-shadow .2s ease;
    backdrop-filter: blur(6px);
  }
  .mode-chip:hover{ color:var(--white); border-color: rgba(229,38,43,0.4); box-shadow: 0 0 0 3px rgba(229,38,43,0.10); }
  .mode-chip.active{
    background: var(--grad-orange); color:#0A0A0C; border-color:transparent;
    box-shadow: 0 6px 20px -6px rgba(229,38,43,0.7), 0 0 0 3px rgba(229,38,43,0.15);
  }

  .tabs{
    display:flex; gap:4px; margin-bottom:22px; flex-wrap:wrap;
    padding:6px;
    background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01)), var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    box-shadow: var(--shadow-md);
    backdrop-filter: blur(10px);
    position:relative; overflow:hidden;
  }
  .tabs::before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background: linear-gradient(90deg, transparent, rgba(229,38,43,0.06), transparent);
  }
  .tab-btn{
    position:relative;
    display:flex; align-items:center; gap:8px;
    background: transparent;
    color: var(--muted);
    border:1px solid transparent;
    padding:11px 18px;
    font-family:'Rajdhani', sans-serif;
    font-weight:600;
    letter-spacing:0.07em;
    text-transform:uppercase;
    font-size:13.5px;
    border-radius:10px;
    box-shadow:none;
    transition: color .2s ease, background .2s ease, border-color .2s ease, transform .12s ease;
  }
  .tab-btn::after{ display:none; }
  .tab-btn:hover{ color: var(--white); background: rgba(229,38,43,0.08); border-color: rgba(229,38,43,0.18); }
  .tab-btn svg{ width:15px; height:15px; opacity:0.75; }
  .tab-btn.active{
    color: #fff;
    background: linear-gradient(135deg, rgba(229,38,43,0.22), rgba(229,38,43,0.28));
    border-color: rgba(229,38,43,0.45);
    box-shadow: 0 6px 20px -8px rgba(229,38,43,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .tab-btn.active svg{ opacity:1; color: var(--orange-2); }
  .tab-btn .pill{ background:var(--red); color:#fff; font-size:10px; padding:2px 7px; border-radius:9px; font-family:'Inter'; margin-left:2px; animation: pillPulse 1.6s ease-in-out infinite; box-shadow: 0 0 12px rgba(235,75,107,0.6); }

  .panel{
    position:relative;
    background:
      radial-gradient(600px 300px at 100% 0%, rgba(229,38,43,0.10), transparent 55%),
      radial-gradient(500px 260px at 0% 100%, rgba(255,255,255,0.08), transparent 55%),
      var(--grad-panel),
      linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0)),
      var(--panel);
    border:1px solid var(--line);
    padding:26px;
    margin-bottom:20px;
    border-radius:8px;
    box-shadow: var(--shadow-md), 0 0 40px -30px rgba(229,38,43,0.6);
    animation: fadeIn .4s ease;
    backdrop-filter: blur(12px);
    overflow:hidden;
  }
  .panel::before{
    content:""; position:absolute; left:0; right:0; top:0; height:2px; border-radius:8px 8px 0 0;
    background: linear-gradient(90deg, transparent, var(--orange), var(--purple), transparent);
    background-size: 200% 100%;
    animation: borderGlow 6s linear infinite;
  }
  .panel::after{
    content:""; position:absolute; inset:0; border-radius:8px; pointer-events:none;
    background: radial-gradient(700px 260px at 50% -20%, rgba(229,38,43,0.10), transparent 60%);
  }
  .panel > *{ position:relative; z-index:1; }
  .panel.accent-blue::before{ background: linear-gradient(90deg, transparent, var(--blue), var(--purple), transparent); background-size:200% 100%; }
  .panel.accent-blue::after{ background: radial-gradient(700px 260px at 50% -20%, rgba(255,255,255,0.12), transparent 60%); }
  .panel.accent-red::before{ background: linear-gradient(90deg, transparent, var(--red), #b92e52, transparent); background-size:200% 100%; }
  .panel.accent-red::after{ background: radial-gradient(700px 260px at 50% -20%, rgba(235,75,107,0.12), transparent 60%); }
  .panel.accent-muted::before{ background: linear-gradient(90deg, transparent, var(--line-strong), transparent); }
  .panel.accent-muted::after{ background:none; }
  .panel h2{
    font-size:20px; color:var(--white); margin-bottom:18px;
    display:flex; align-items:center; gap:10px;
  }
  .panel h2 .sub{ color:var(--muted); font-size:12px; text-transform:none; letter-spacing:0; margin-left:8px; font-family:'Inter',sans-serif; font-weight:400; }

  .hero-stats{
    display:grid; grid-template-columns: repeat(auto-fit,minmax(150px,1fr));
    gap:1px; margin-bottom:22px;
    background: linear-gradient(135deg, rgba(229,38,43,0.28), rgba(255,255,255,0.28), rgba(229,38,43,0.28));
    border-radius:8px; overflow:hidden;
    border:1px solid var(--line);
    box-shadow: 0 12px 40px -22px rgba(0,0,0,0.7);
  }
  .hero-card{
    background: linear-gradient(180deg, var(--panel2), var(--panel));
    padding:20px; animation: fadeIn .4s ease both;
    transition: transform .25s ease, background .25s ease, box-shadow .25s ease;
    position:relative;
  }
  .hero-card::before{
    content:""; position:absolute; inset:0; pointer-events:none; opacity:0;
    background: radial-gradient(200px 120px at 50% 0%, rgba(229,38,43,0.18), transparent 70%);
    transition: opacity .3s ease;
  }
  .hero-card:hover{ background: linear-gradient(180deg, var(--panel3), var(--panel2)); transform: translateY(-2px); }
  .hero-card:hover::before{ opacity:1; }
  .hero-card:nth-child(1){ animation-delay:.02s; } .hero-card:nth-child(2){ animation-delay:.08s; }
  .hero-card:nth-child(3){ animation-delay:.14s; } .hero-card:nth-child(4){ animation-delay:.2s; }
  .hero-card .val{ font-family:'IBM Plex Mono',monospace; font-size:28px; font-weight:600; position:relative;
    background: linear-gradient(180deg,#FFD5B0 0%, #FF9147 45%, #B48CFF 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow: 0 0 30px rgba(229,38,43,0.25);
  }
  .hero-card .lbl{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.11em; margin-top:6px; position:relative; }

  .grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap:14px; }
  .field label{ display:block; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.11em; margin-bottom:7px; }
  .field select, .field input{ width:100%; }
  .empty-note{ color:var(--muted); font-size:13px; padding:8px 0; }
  .helper-note{
    color:var(--muted); font-size:12.5px; line-height:1.6; margin-top:18px;
    padding:14px 16px;
    background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0)), var(--panel2);
    border-left:3px solid var(--orange);
    border-radius:0 8px 8px 0;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
  }
  .helper-note.blue{ border-left-color: var(--blue); }

  .rank-row{ display:flex; align-items:center; gap:20px; flex-wrap:wrap; }
  .badge{
    width:74px; height:74px;
    clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
    display:flex; align-items:center; justify-content:center;
    font-family:'Rajdhani', sans-serif; font-weight:700; font-size:22px;
    color:#0A0A0C; flex-shrink:0;
    animation: popIn .4s cubic-bezier(.2,1.4,.4,1);
    filter: drop-shadow(0 8px 18px rgba(0,0,0,0.55)) drop-shadow(0 0 14px rgba(229,38,43,0.35));
  }

  /* ============ CORREÇÃO DO PAINEL DE PARTIDAS ============ */
  /* O painel esquerdo (classificação) e o direito (partidas) ficam
     lado a lado no evento. Antes, .panel ganhava overflow:auto e as
     linhas de partida tinham nowrap — o painel direito ficava travado
     e cortado. Agora o container respira, as linhas quebram e os
     inputs de placar se acomodam. */
  .panel, .group-box { overflow: visible; }

  /* ============ FUNDO ANIMADO ============ */
  body::before, body::after{
    content:""; position:fixed; inset:-20%; z-index:-1; pointer-events:none;
    background-repeat:no-repeat;
    filter: blur(70px); opacity:.85;
  }
  body::before{
    background:
      radial-gradient(420px 320px at 20% 30%, rgba(255,255,255,0.35), transparent 60%),
      radial-gradient(360px 300px at 80% 20%, rgba(229,38,43,0.28), transparent 60%),
      radial-gradient(500px 400px at 70% 85%, rgba(229,38,43,0.32), transparent 60%);
    animation: bgFloat 22s ease-in-out infinite alternate;
  }
  body::after{
    background:
      radial-gradient(300px 260px at 85% 55%, rgba(255,255,255,0.22), transparent 60%),
      radial-gradient(360px 300px at 15% 75%, rgba(229,38,43,0.18), transparent 60%),
      radial-gradient(420px 340px at 45% 15%, rgba(229,38,43,0.22), transparent 60%);
    animation: bgFloat2 28s ease-in-out infinite alternate;
    mix-blend-mode: screen;

  @keyframes bgFloat{
    0%   { transform: translate3d(0,0,0) scale(1); }
    50%  { transform: translate3d(3%, -2%, 0) scale(1.06); }
    100% { transform: translate3d(-2%, 3%, 0) scale(1.02); }
  }
  @keyframes bgFloat2{
    0%   { transform: translate3d(0,0,0) scale(1.02); }
    50%  { transform: translate3d(-4%, 2%, 0) scale(1.08); }
    100% { transform: translate3d(3%, -3%, 0) scale(1); }
  }
  @media (prefers-reduced-motion: reduce){
    body::before, body::after{ animation: none; }
  }

/* ================= BRCS2 — Counter-Strike 2 · preto & vermelho · minimalista ================= */
:root{--black:#0A0A0B;--black-2:#0E0E10;--panel:#111113;--panel2:#16161A;--panel3:#1D1D22;
--line:rgba(255,255,255,.07);--line-strong:rgba(255,255,255,.14);--white:#F4F4F5;--muted:#9A9AA3;--muted-2:#62626B;
--orange:#E5262B;--orange-2:#FF5A5F;--orange-soft:rgba(229,38,43,.14);--blue:#B5B5BD;--blue-deep:#6B6B73;--blue-soft:rgba(255,255,255,.06);
--purple:#E5262B;--purple-2:#FF5A5F;--purple-soft:rgba(229,38,43,.14);--red:#FF3B3F;--red-soft:rgba(255,59,63,.14);
--grad-orange:linear-gradient(180deg,#F23338,#C71D22);--grad-cosmic:linear-gradient(180deg,#F23338,#C71D22);--grad-panel:none;
--shadow-sm:none;--shadow-md:none;--shadow-glow:0 0 0 1px rgba(229,38,43,.5);--tactical-lime:#FF4D50;--tactical-cyan:#F4F4F5;--glass:#111113}
html,body{background:#0A0A0B!important}
body{font-size:14px}
body::before,body::after,.bg-video,.bg-tint,.bg-tracers,.iris-petal-field,.mission-hero::before,.mission-hero::after,.hero-border-beam,
.corner-mark,.telemetry-rail,.panel::before,.panel::after,.header::before,.header::after,.tabs::before,.hud-stat::before,.brc-dock::before{display:none!important}
*{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;text-shadow:none!important}
::selection{background:var(--orange);color:#fff}
.app{max-width:1120px;padding:0 16px 90px}
/* topo estilo FACEIT */
.header{position:sticky;top:0;z-index:30;margin:0 -16px 14px;padding:0 16px;min-height:56px;border:0;border-bottom:1px solid var(--line);border-radius:0!important;background:rgba(10,10,11,.97)!important;box-shadow:none}
.brand-mark{width:20px;height:22px;border-radius:0;transform:none;box-shadow:none;background:var(--orange);clip-path:polygon(0 0,100% 0,100% 68%,50% 100%,0 68%)}
.brand h1{font-size:19px;letter-spacing:.14em}
.brand p{font-size:9px;letter-spacing:.16em;color:var(--muted-2);text-transform:uppercase;margin:2px 0 0}
.header-controls .mono{padding:5px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font-size:12px}
.tabs{padding:0;gap:2px;margin-bottom:14px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent!important;box-shadow:none;overflow-x:auto;flex-wrap:nowrap}
.tab-btn{flex:0 0 auto;min-height:42px;padding:0 14px;border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent!important;color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase;box-shadow:none;transform:none!important}
.tab-btn:hover{color:#fff;background:transparent!important;border-color:transparent}
.tab-btn.active{color:#fff;border:0;border-bottom:2px solid var(--orange);background:transparent!important;box-shadow:none}
.tab-btn::after{display:none!important}
.tab-btn.active svg{color:var(--orange-2)}
.tab-btn .pill,.pill{animation:none;box-shadow:none;background:var(--orange);border-radius:4px}
/* faixa compacta (antigo hero) */
.mission-hero{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px;min-height:0;margin:0 0 12px;padding:12px 16px;border:1px solid var(--line);border-left:3px solid var(--orange);border-radius:8px;background:var(--panel)!important;box-shadow:none}
.mission-copy{flex:1 1 300px}
.mission-copy h2{margin:0;font-size:22px;line-height:1.1;letter-spacing:.03em;color:#fff}
.mission-copy h2 em{color:var(--orange);text-shadow:none}
.mission-copy p,.mission-subline{display:none}
.mission-kicker{margin:0 0 5px;font-size:9px;letter-spacing:.16em;color:var(--orange-2)}
.mission-kicker::before{width:6px;height:6px;box-shadow:none;animation:none;background:var(--orange)}
.mission-status{display:flex;gap:6px;width:auto;justify-self:auto;align-self:auto}
.hud-stat{min-width:86px;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);transform:none!important}
.hud-stat strong{font-size:18px;color:#fff!important}
.hud-stat span{margin-top:4px;font-size:9px}
.hud-stat:hover{background:var(--panel2);border-color:var(--line-strong)}
/* painéis e cartões */
.panel,.modal,.event-card,.mod-card,.stat-card,.hero-card,.group-box,.bracket-match,.event-banner,.event-detail-hero,.hero-stats,.auth-card,.auth-intel,.login-hero,.storage-warning{border-radius:8px!important;border:1px solid var(--line);background:var(--panel)!important;box-shadow:none!important}
.panel{padding:16px;margin-bottom:12px;animation:none}
.panel:hover,.event-card:hover{border-color:var(--line-strong);box-shadow:none!important;transform:none}
.panel h2,.modal h2{font-size:15px;letter-spacing:.1em}
.panel.accent-red,.mod-card.is-alert{border-left:3px solid var(--orange)}
.modal-overlay{background:rgba(0,0,0,.8)}
.modal::before{display:none}
/* botões e campos */
button,.secondary,.primary{border-radius:6px;box-shadow:none}
button.primary,.primary{background:var(--orange)!important;background-image:none!important;border:1px solid var(--orange);color:#fff}
button.primary:hover,.primary:hover{background:#FF3B3F!important;transform:none;box-shadow:none}
.secondary{background:transparent!important;border:1px solid var(--line-strong);color:var(--white)}
.secondary:hover{border-color:var(--orange);color:#fff}
input,select,textarea{border-radius:6px;background:#0D0D0F;border:1px solid var(--line);color:var(--white)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--orange);box-shadow:none}
/* modos (MD10, 5v5, 1v5...) */
.mode-chips{padding:0;margin-bottom:12px;gap:6px;border:0;background:transparent}
.mode-chip{padding:6px 12px;border-radius:4px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;transform:none!important;box-shadow:none}
.mode-chip:hover{color:#fff;border-color:var(--line-strong)}
.mode-chip.active{background:var(--orange);border-color:var(--orange);color:#fff}
/* ranks + nível estilo FACEIT */
.badge{position:relative;overflow:visible;border-radius:8px;box-shadow:none}
.badge .lvl{position:absolute;right:-7px;bottom:-7px;min-width:20px;height:20px;padding:0 4px;border-radius:50%;background:#0A0A0B;border:2px solid var(--orange);color:#fff;font:700 10px/16px 'Rajdhani',sans-serif;font-style:normal;text-align:center}
.progress-bar{height:4px;border-radius:2px;background:var(--panel3)}
.progress-fill{background:var(--orange)!important;box-shadow:none}
.status-badge{border-radius:4px}
/* tela de login */
.auth-gradient-frame{padding:0;background:none!important;animation:none!important;box-shadow:none}
.auth-gradient-frame::after{display:none}
.auth-intel{background:var(--panel)!important}
/* dock mobile */
.brc-dock{border-radius:12px!important;background:#0E0E10!important;border:1px solid var(--line-strong);box-shadow:none!important}
.dock-btn.active{background:var(--orange-soft)!important;box-shadow:none!important;color:#fff}
.dock-btn.active svg{color:var(--orange-2)}
@media (max-width:760px){.mission-hero{padding:12px}.mission-status{width:100%}.hud-stat{flex:1;min-width:0}.header-controls .mono{display:none!important}}


/* ===== Layout vertical + níveis ===== */
.app{max-width:1280px}
.shell{display:grid;grid-template-columns:208px minmax(0,1fr);gap:20px;align-items:start}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:16px;padding:18px 14px 18px 0;border-right:1px solid var(--line)}

.challenger-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.challenger-chip{padding:4px 8px;border:1px solid rgba(229,38,43,.5);border-radius:4px;font-size:12px;color:#fff}

<script>

const SECURITY = Object.freeze({
  maxSharedPayloadBytes: 850000,
  maxProofBytes: 5 * 1024 * 1024,
  allowedProofTypes: new Set(['image/png', 'image/jpeg', 'image/webp']),
  trustedAiOrigins: new Set(['https://brcsgoia.ttyfit518.workers.dev']),
  authWindowMs: 10 * 60 * 1000,
  maxAuthAttempts: 5
});
let authAttemptTimes = [];
function escapeUntrustedText(value){ return String(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
function sanitizeSharedData(value){
  if(typeof value === 'string') return escapeUntrustedText(value);
  if(Array.isArray(value)) return value.map(sanitizeSharedData);
  if(value && typeof value === 'object') return Object.fromEntries(Object.entries(value).map(([key, item]) => [key, sanitizeSharedData(item)]));
  return value;
}
function byteLength(value){ return new TextEncoder().encode(String(value)).length; }
function safeParseShared(value){ try{ return sanitizeSharedData(JSON.parse(value)); }catch(e){ console.warn('Dados compartilhados inválidos foram descartados.'); return []; } }
function validateNick(nick){ const clean = String(nick || '').trim(); if(clean.length < 3 || clean.length > 24) return 'Use um nick entre 3 e 24 caracteres.'; if(!/^[\p{L}\p{N}_ .-]+$/u.test(clean)) return 'Use apenas letras, números, espaço, ponto, hífen ou underscore no nick.'; return ''; }
function validatePassword(password){ if(String(password).length < 12) return 'Use uma senha com pelo menos 12 caracteres.'; if(!/[a-z]/.test(password) || !/[A-Z]/.test(password) || !/\d/.test(password)) return 'Inclua letras maiúsculas, minúsculas e números na senha.'; return ''; }
function canAttemptAuthentication(){ const now = Date.now(); authAttemptTimes = authAttemptTimes.filter(time => now - time < SECURITY.authWindowMs); if(authAttemptTimes.length >= SECURITY.maxAuthAttempts) return false; authAttemptTimes.push(now); return true; }
function validateProofFile(file){ if(!file) return 'Anexe um print do placar final da partida.'; if(!SECURITY.allowedProofTypes.has(file.type)) return 'Envie o print em PNG, JPEG ou WebP.'; if(file.size > SECURITY.maxProofBytes) return 'O print deve ter no máximo 5 MB.'; return ''; }
function isTrustedAiProxy(url){ try{ const parsed = new URL(url); return parsed.protocol === 'https:' && SECURITY.trustedAiOrigins.has(parsed.origin); }catch(e){ return false; } }
async function loadModeratorClaim(user){ try{ const token = await user.getIdTokenResult(true); return token && token.claims && token.claims.moderator === true; }catch(e){ console.warn('Não foi possível validar a permissão de moderador.'); return false; } }

function traduzErroAuth(e){
  const code = e && e.code || '';
  const map = {
    'auth/email-already-in-use': 'Esse e-mail já tem uma conta. Tente entrar em vez de criar uma nova.',
    'auth/invalid-email': 'E-mail inválido.',
    'auth/weak-password': 'Senha muito curta — use pelo menos 6 caracteres.',
    'auth/wrong-password': 'Senha incorreta.',
    'auth/user-not-found': 'Não existe conta com esse e-mail.',
    'auth/invalid-credential': 'E-mail ou senha incorretos.',
    'auth/too-many-requests': 'Muitas tentativas seguidas — espere um pouco e tente de novo.',
    'auth/popup-closed-by-user': 'A janela de login foi fechada antes de terminar.',
    'auth/account-exists-with-different-credential': 'Já existe uma conta com esse e-mail usando outro método de login.'
  };
  return map[code] || 'Não foi possível concluir. Tente novamente.';
}

async function socialSignIn(providerName){
  authError = '';
  try{
    const provider = providerName === 'google'
      ? new firebase.auth.GoogleAuthProvider()
      : new firebase.auth.GithubAuthProvider();
    await firebase.auth().signInWithPopup(provider);
  }catch(e){
    authError = traduzErroAuth(e);
    renderAuthGate();
  }
}

function renderAuthGate(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <section class="auth-command-screen" aria-label="Acesso BRCS2">
      <div class="auth-intel">
        <span class="auth-overline">BRCS2 // Operação pronta</span>

          <div class="field"><label>Email</label><input type="email" id="auth_email" placeholder="voce@exemplo.com"></div>

          <div style="margin-top:22px; padding-top:18px; border-top:1px solid var(--line);"><p class="empty-note" style="margin-bottom:11px;">ou continue com</p><div style="display:flex; gap:8px;"><button class="secondary" id="googleBtn" type="button">Google</button><button class="secondary" id="githubBtn" type="button">GitHub</button></div></div>
        </div>

  document.getElementById('authSwitchBtn').addEventListener('click', () => {

  });
  document.getElementById('googleBtn').addEventListener('click', () => socialSignIn('google'));
  document.getElementById('githubBtn').addEventListener('click', () => socialSignIn('github'));
  document.getElementById('authSubmitBtn').addEventListener('click', async () => {
    const btn = document.getElementById('authSubmitBtn');
    const email = document.getElementById('auth_email').value.trim();
    const pass = document.getElementById('auth_pass').value;
    authError = '';
    btn.disabled = true;

        await saveShared('brcsgo:users', users);
        players.push({id: uid, name: nick, ownerUid: uid, region});
        await saveShared('brcsgo:players', players);
      } else {
        await firebase.auth().signInWithEmailAndPassword(email, pass);
      }
    }catch(e){
      authError = traduzErroAuth(e);
      btn.disabled = false;
      renderAuthGate();
    }
  });
}

    if(!REGIONS.includes(region)){ authError = 'Escolha a região em que você joga.'; renderProfileSetupGate(); return; }

    const role = (modCode && modCode === MOD_SIGNUP_CODE) ? 'moderator' : 'member';
    userProfile = {uid: authUser.uid, playerName: nick, role, region};
    users.push(userProfile);
    await saveShared('brcsgo:users', users);
    players.push({id: authUser.uid, name: nick, ownerUid: authUser.uid, region});
    await saveShared('brcsgo:players', players);
    currentPlayerId = authUser.uid;
    render();
  });
}

}

}
function playerTier(p, s, mode, chIds){

}

function computeEloDelta(m){
  if(m.mode === '1v5'){
    // No 1v5, é normal ter muitos kills contra 5 bots sozinho — o que difere skill de sorte
    // é sobreviver (poucas mortes) e, principalmente, VENCER. Kills contam pouco aqui de propósito.
    const perf = ((m.pontos||0)*0.3) + ((m.mvps||0)*2) - (m.deaths*2.0) + ((m.assists||0)*0.3);
    let base = m.result === 'vitoria' ? 35 : (m.result === 'empate' ? 5 : -8);
    let delta = Math.round(base + (perf*0.4));
    return Math.max(-25, Math.min(50, delta));
  }
  const perf = ((m.pontos||0)*0.5) + ((m.mvps||0)*3) - (m.deaths*1.0) + ((m.assists||0)*0.3);
  let base = m.result === 'vitoria' ? 18 : (m.result === 'empate' ? 2 : -14);
  let perfAdj = (perf - 18) * 0.6;
  let delta = Math.round(base + perfAdj);
  return Math.max(-40, Math.min(45, delta));
}

function flagsFor(m){
  const flags = [];
  if(m.mode === '1v5'){
    if(m.deaths > 16) flags.push('Mais mortes do que rodadas possíveis numa partida');
    if((m.mvps||0) > 16) flags.push('MVPs muito acima do normal');
    if((m.pontos||0) > 0 && m.pontos < m.kills) flags.push('Pontuação incoerente com os kills informados');
    return flags;
  }
  const kd = m.deaths > 0 ? m.kills/m.deaths : m.kills;
  if(m.kills > 40) flags.push('Kills muito acima do normal');
  if(kd > 6) flags.push('K/D extremo');
  if(m.deaths === 0 && m.kills > 15) flags.push('Zero mortes com muitos kills');
  if((m.mvps||0) > 16) flags.push('MVPs muito acima do normal');
  if((m.pontos||0) > 0 && m.pontos < m.kills) flags.push('Pontuação incoerente com os kills informados');
  return flags;
}

function computePlacementElo(first10, mode){
  const n = first10.length;
  if(n === 0) return 0;
  const avg = key => first10.reduce((s,m) => s + (m[key]||0), 0) / n;
  const avgPontos = avg('pontos');
  const avgMvps = avg('mvps');
  const avgDeaths = avg('deaths');
  const avgAssists = avg('assists');
  const wins = first10.filter(m => m.result === 'vitoria').length;
  const winRate = wins / n;

  let skill;
  if(mode === '1v5'){
    // No 1v5, ganhar é raríssimo mesmo pra quem é muito bom — o desempenho individual
    // (pontos, MVPs, sobrevivência) precisa pesar muito mais que o resultado da partida.
    skill = (avgPontos*6) + (avgMvps*55) - (avgDeaths*10) + (avgAssists*10) + (winRate*450);
  } else {
    skill = (avgPontos*5) + (avgMvps*45) - (avgDeaths*12) + (avgAssists*8) + (winRate*550);
  }
  return Math.max(ELO_MIN, Math.round(skill));
}

function computeModeStats(playerId, mode){
  const cfg = MODES[mode];
  const pm = matches.filter(m => m.playerId === playerId && m.status === 'aprovada' && (m.mode || 'competitivo') === mode)
    .sort((a,b) => a.createdAt - b.createdAt);
  const total = pm.length;
  const kills = pm.reduce((s,m) => s + m.kills, 0);
  const deaths = pm.reduce((s,m) => s + m.deaths, 0);
  const assists = pm.reduce((s,m) => s + (m.assists||0), 0);
  const pontos = pm.reduce((s,m) => s + (m.pontos||0), 0);
  const mvps = pm.reduce((s,m) => s + (m.mvps||0), 0);
  const wins = pm.filter(m => m.result === 'vitoria').length;
  const losses = pm.filter(m => m.result === 'derrota').length;
  const winRate = total > 0 ? (wins/total*100) : 0;
  const kd = deaths > 0 ? (kills/deaths) : kills;

  let elo = 0, historyMap = {};
  if(cfg.hasPatente && total >= 10){
    const first10 = pm.slice(0, 10);
    const placementElo = computePlacementElo(first10, mode);
    const hist = [];
    first10.forEach((m, i) => {
      // as 10 partidas de calibragem, juntas, definem a colocação — não sobem uma a uma
      hist.push({...m, eloBefore: i === 0 ? 0 : placementElo, eloAfter: placementElo, eloDelta: i === 9 ? placementElo : 0, isPlacement: true});
    });
    let e = placementElo;
    pm.slice(10).forEach(m => {
      const delta = computeEloDelta(m);
      const before = e; e = Math.max(ELO_MIN, e + delta);
      hist.push({...m, eloBefore: before, eloAfter: e, eloDelta: delta, isPlacement: false});
    });
    elo = e;
    historyMap = Object.fromEntries(hist.map(h => [h.id, h]));
  }
  return {
    playerId, mode, total, kills, deaths, assists, pontos, mvps, wins, losses, winRate, kd,
    elo, calibrating: cfg.hasPatente && total < 10, historyMap
  };
}

function getModeRanking(mode){
  const cfg = MODES[mode];
  if(!cfg.rankBy) return [];
  return players.map(p => ({p, s: computeModeStats(p.id, mode)}))
    .filter(r => r.s.total > 0)
    .sort((a,b) => {
      if(cfg.rankBy === 'elo') return b.s.elo - a.s.elo;
      if(cfg.rankBy === 'winRate') return b.s.winRate - a.s.winRate;
      if(cfg.rankBy === 'kills') return b.s.kills - a.s.kills;
      return 0;
    });
}

function compressImage(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const maxW = 960;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.88));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function extractJSON(text){
  try{ return JSON.parse(text); }catch(e){}
  const m = text.match(/\{[\s\S]*\}/);
  if(m){ try{ return JSON.parse(m[0]); }catch(e){} }
  return null;
}

function normalizeText(s){
  return (s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
}
function normalizeResultado(s){
  const n = normalizeText(s);
  if(n.includes('vitor')) return 'vitoria';
  if(n.includes('derrot')) return 'derrota';
  if(n.includes('empat')) return 'empate';
  return null;
}
function matchMap(s){
  const n = normalizeText(s);
  if(!n) return null;
  return MAPS.find(m => { const nm = normalizeText(m); return nm === n || n.includes(nm) || nm.includes(n); }) || null;
}
function matchMode(s){
  const n = normalizeText(s);
  if(!n) return null;
  for(const k of MODE_KEYS){
    const nl = normalizeText(MODES[k].label);
    if(nl === n || n.includes(nl)) return k;
  }
  return null;
}

const LEVEL_ARC = [.05,.15,.27,.40,.52,.65,.78,.90,.96,1];
function challengerSVG(size){
  let leaves = '';
  for(let i=0;i<6;i++){
    const deg = 120 + i*22, a = deg*Math.PI/180, x = Math.cos(a)*12.5, y = Math.sin(a)*12.5;
    leaves += `<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="1.7" ry="3.5" transform="rotate(${deg+90} ${x.toFixed(1)} ${y.toFixed(1)})" fill="#E5262B"/>`
            + `<ellipse cx="${(-x).toFixed(1)}" cy="${y.toFixed(1)}" rx="1.7" ry="3.5" transform="rotate(${270-deg} ${(-x).toFixed(1)} ${y.toFixed(1)})" fill="#E5262B"/>`;
  }
  return `<svg viewBox="-20 -20 40 40" width="${size}" height="${size}" aria-label="Challenger"><circle r="18" fill="#17171A"/>${leaves}<polygon points="-6,-6 7,-1 -1,0 7,2 -6,7 -3,0" fill="#E5262B"/><path d="M-6 13L6 9M6 13L-6 9" stroke="#E5262B" stroke-width="1.4"/></svg>`;
}
function tierIconSVG(tier, size){

  if(tier.challenger) return challengerSVG(size);
  const L = tier.level || 1, r = 14, C = 2*Math.PI*r, len = (C*LEVEL_ARC[L-1]).toFixed(1);
  return `<svg viewBox="-20 -20 40 40" width="${size}" height="${size}" aria-label="Nível ${L}"><circle r="18" fill="#17171A"/><circle r="${r}" fill="none" stroke="#2A2A2F" stroke-width="3.4"/><circle r="${r}" fill="none" stroke="${tier.color}" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="${len} ${C.toFixed(1)}" transform="rotate(135)"/><text y="5.4" text-anchor="middle" font-family="Rajdhani,sans-serif" font-weight="700" font-size="${L===10?14:16}" fill="${tier.color}">${L}</text></svg>`;

        </span>
        <button class="secondary" id="logoutBtn" type="button">Sair</button>
      </div>
    </aside>
    <main class="main">

    <section class="mission-hero" aria-label="Centro de comando BRCS2"><span class="hero-border-beam" aria-hidden="true"></span>
      <span class="corner-mark">BR // COMMAND CENTER</span>
      <div class="mission-copy">
        <span class="mission-kicker">Rede BRCS2 online</span>
        <h2>Partidas, ranks e <em>níveis.</em></h2>
        <p>Centralize resultados, acompanhe estatísticas e dispute o topo do ranking da comunidade Counter-Strike 2 (CS2).</p>
        <div class="mission-subline">
          <span class="mission-chip">Modo <b>${MODES[viewMode].label}</b></span>
          <span class="mission-chip">Perfil <b>${isMod ? 'Staff autorizado' : 'Operador ativo'}</b></span>
        </div>
      </div>
      <div class="mission-status" aria-label="Resumo da comunidade">
        <div class="hud-stat"><strong>${players.length}</strong><span>Operadores</span></div>
        <div class="hud-stat"><strong>${matches.length}</strong><span>Partidas</span></div>
        <div class="hud-stat"><strong>${events.filter(ev => ev.status !== 'finished').length}</strong><span>Eventos ativos</span></div>
        <div class="hud-stat"><strong>${pendingCount}</strong><span>Em revisão</span></div>
      </div>
      <div class="telemetry-rail" aria-label="Telemetria da operação">
        <div class="telemetry-item"><span>Operação selecionada</span><strong>${MODES[viewMode].label}</strong></div>
        <div class="telemetry-item is-alert"><span>Sistema</span><strong>Sincronizado</strong></div>
        <div class="telemetry-item"><span>Objetivo</span><strong>${activeTab === 'registrar' ? 'Registrar resultado' : 'Subir no ranking'}</strong></div>
      </div>
    </section>

    ${activeEventBannerHTML()}


    ${activeTab==='perfil'||activeTab==='historico'||activeTab==='ranking' ? `
      <div class="mode-chips">
        ${MODE_KEYS.map(k => `<div class="mode-chip ${viewMode===k?'active':''}" data-mode="${k}">${MODES[k].label}</div>`).join('')}
      </div>
    ` : ''}

    <div id="tabContent"></div>
    </main></div>
    <nav class="brc-dock" aria-label="Navegação rápida">
      <button class="dock-btn ${activeTab==='registrar'?'active':''}" data-tab="registrar">${ICONS.registrar}<span>Registrar</span></button>
      <button class="dock-btn ${activeTab==='perfil'?'active':''}" data-tab="perfil">${ICONS.perfil}<span>Perfil</span></button>
      <button class="dock-btn ${activeTab==='historico'?'active':''}" data-tab="historico">${ICONS.historico}<span>Histórico</span></button>
      <button class="dock-btn ${activeTab==='ranking'?'active':''}" data-tab="ranking">${ICONS.ranking}<span>Ranking</span></button>
      <button class="dock-btn ${activeTab==='eventos'?'active':''}" data-tab="eventos">${ICONS.eventos}<span>Eventos</span></button>
    </nav>
  `;

  document.getElementById('logoutBtn').addEventListener('click', () => {
    firebase.auth().signOut();
  });
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => { activeTab = btn.dataset.tab; render(); });
  });
  document.querySelectorAll('.dock-btn').forEach(btn => {
    btn.addEventListener('click', () => { activeTab = btn.dataset.tab; render(); });
  });
  document.querySelectorAll('.mode-chip').forEach(chip => {
    chip.addEventListener('click', () => { viewMode = chip.dataset.mode; render(); });
  });

  renderTab();
}

function renderTab(){
  if(activeTab === 'moderacao' && (!userProfile || userProfile.role !== 'moderator')) activeTab = 'ranking';
  const el = document.getElementById('tabContent');
  if(activeTab === 'registrar') el.innerHTML = registrarHTML();
  else if(activeTab === 'perfil') el.innerHTML = perfilHTML();
  else if(activeTab === 'historico') el.innerHTML = historicoHTML();
  else if(activeTab === 'ranking') el.innerHTML = rankingHTML();
  else if(activeTab === 'eventos') el.innerHTML = eventosHTML();
  else if(activeTab === 'moderacao') el.innerHTML = moderacaoHTML();
  attachTabEvents();
  document.querySelectorAll('[data-region]').forEach(chip => chip.addEventListener('click', () => { rankRegion = chip.dataset.region; renderTab(); }));
  const regionSel = document.getElementById('regionSelect');
  if(regionSel) regionSel.addEventListener('change', async () => {
    const region = regionSel.value;
    if(!REGIONS.includes(region)) return;
    const pl = players.find(x => x.id === currentPlayerId); if(pl) pl.region = region;
    const us = users.find(x => x.uid === authUser.uid); if(us) us.region = region;
    if(userProfile) userProfile.region = region;
    await saveShared('brcsgo:players', players);
    await saveShared('brcsgo:users', users);
    showToast('Região atualizada: ' + region);
    renderTab();
  });

  requestAnimationFrame(() => {
    document.querySelectorAll('.progress-fill').forEach(bar => {
      const target = bar.dataset.target;
      if(target !== undefined) bar.style.width = target + '%';
    });
  });

  if(activeTab === 'moderacao'){
    loadProofImages(matches.filter(m => m.status === 'pendente'));
  }
  if(activeTab === 'registrar'){
    const modeSelect = document.getElementById('f_mode');
    if(modeSelect) updateFormForMode(modeSelect.value);
  }
}

function updateFormForMode(modeKey){
  const cfg = MODES[modeKey];
  document.querySelectorAll('#matchForm [data-field]').forEach(w => {
    const f = w.dataset.field;
    const show = f === 'resultado' ? cfg.hasResultado : cfg.fields.includes(f);
    w.style.display = show ? '' : 'none';
  });
}

function regionBlockHTML(p){
  return `<div class="region-row ${p.region ? '' : 'missing'}"><label for="regionSelect">Região em que você joga</label><select id="regionSelect"><option value="">Selecionar região…</option>${REGIONS.map(r => `<option value="${r}" ${p.region === r ? 'selected' : ''}>${regionLabel(r)}</option>`).join('')}</select>${p.region ? '' : '<span class="empty-note">Defina sua região para entrar no ranking regional e disputar o Challenger.</span>'}</div>`;
}
function perfilHTML(){
  const p = players.find(p => p.id === currentPlayerId);
  if(!p) return `<div class="panel accent-muted"><p class="empty-note">Selecione ou crie um jogador acima para ver o perfil.</p></div>`;
  const cfg = MODES[viewMode];
  const s = computeModeStats(p.id, viewMode);
  const pendingOwn = matches.filter(m => m.playerId === p.id && m.status === 'pendente' && (m.mode||'competitivo') === viewMode).length;

  let rankBlock = '';
  if(cfg.hasPatente){
    if(s.calibrating){
      const calibMs = matches.filter(m => m.playerId === p.id && (m.mode||'competitivo') === viewMode && m.status === 'aprovada').sort((a,b) => (a.createdAt||0) - (b.createdAt||0)).slice(0,10);
      const left = Math.max(0, 10 - s.total);
      const R = 44, C = 2*Math.PI*R, off = (C * (1 - Math.min(10, s.total)/10)).toFixed(1);
      let slots = '';
      for(let i=0;i<10;i++){
        const m = calibMs[i];
        const kind = m ? (m.result === 'vitoria' ? 'win' : (m.result === 'empate' ? 'draw' : 'loss')) : (i === calibMs.length ? 'next' : 'empty');
        slots += `<i class="md10-slot ${kind}" style="--i:${i}" title="${m ? (m.map || '') : ''}"></i>`;
      }
      rankBlock = `
        <div class="md10">
          <div class="md10-ring"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="trk" cx="50" cy="50" r="${R}"/><circle class="arc" cx="50" cy="50" r="${R}" style="--c:${C.toFixed(1)};--off:${off}"/></svg><div class="md10-count"><b>${Math.min(10, s.total)}</b><span>/10</span></div></div>
          <div class="md10-info">
            <div class="md10-tag">MD10 · Calibração</div>
            <div class="md10-title">${left} ${left === 1 ? 'partida' : 'partidas'} para revelar seu nível</div>
            <div class="md10-slots">${slots}</div>
            <div class="md10-note">As 10 partidas juntas definem seu ELO inicial.</div>
          </div>
        </div>`;
    } else {
      const tier = playerTier(p, s, viewMode);
      const next = LEVELS[tier.index+1];
      const pct = next ? Math.min(100, ((s.elo - tier.min) / (next.min - tier.min)) * 100) : 100;
      rankBlock = `
        <div class="rank-row">
          ${tierBadgeHTML(tier)}
          <div class="rank-info">
            <div class="rank-name">${tier.challenger ? 'Challenger · Top ' + CHALLENGER_SLOTS + ' ' + (p.region || '') : tier.name}</div>
            <div class="elo mono">${s.elo} ELO${tier.challenger ? ' · Nível 10' : ' · Nível ' + tier.level}</div>
            <div class="progress-bar"><div class="progress-fill" data-target="${pct}"></div></div>
            <div class="progress-label">${next ? `${Math.round(pct)}% até ${next.name}` : (tier.challenger ? 'Você está entre os melhores da região' : 'Nível máximo alcançado')}</div>
          </div>
        </div>`;
    }
  } else if(cfg.rankBy){
    const ranking = getModeRanking(viewMode);
    const pos = ranking.findIndex(r => r.p.id === p.id);
    rankBlock = `
      <div class="helper-note">
        ${MODES[viewMode].label} não possui níveis de ELO. ${pos >= 0 ? `Você está em <b>${pos+1}º lugar</b> no ranking (${cfg.rankBy === 'winRate' ? 'por taxa de vitória' : 'por kills'}).` : 'Registre partidas aprovadas neste modo para entrar no ranking.'}
      </div>`;
  } else {
    rankBlock = `<div class="helper-note">${MODES[viewMode].label} é só para diversão — sem ranking oficial.</div>`;
  }

  const cards = [];
  cards.push(`<div class="stat-card"><div class="val">${s.total}</div><div class="lbl">Partidas</div></div>`);
  if(cfg.hasResultado){
    cards.push(`<div class="stat-card"><div class="val win">${s.wins}</div><div class="lbl">Vitórias</div></div>`);
    cards.push(`<div class="stat-card"><div class="val loss">${s.losses}</div><div class="lbl">Derrotas</div></div>`);
    cards.push(`<div class="stat-card"><div class="val">${s.winRate.toFixed(0)}%</div><div class="lbl">Taxa Vitória</div></div>`);
  }
  cards.push(`<div class="stat-card"><div class="val">${s.kd.toFixed(2)}</div><div class="lbl">K/D</div></div>`);
  cards.push(`<div class="stat-card"><div class="val">${s.kills}</div><div class="lbl">Kills Totais</div></div>`);
  cards.push(`<div class="stat-card"><div class="val">${s.pontos}</div><div class="lbl">Pontos Totais</div></div>`);
  if(cfg.fields.includes('mvps')) cards.push(`<div class="stat-card"><div class="val">${s.mvps}</div><div class="lbl">MVPs</div></div>`);

  const orphans = players.filter(op => !op.ownerUid && op.id !== currentPlayerId);
  const claimBlock = orphans.length > 0 ? `
    <div class="panel accent-red" style="margin-top:16px;">
      <h2>Reivindicar Jogador Antigo <span class="sub">de antes do sistema de login</span></h2>
      <p class="empty-note">Se você jogava aqui antes de existir conta, escolha seu nick antigo abaixo pra transferir todo o histórico dele pra essa conta.</p>
      <div class="grid" style="max-width:400px;">
        <div class="field">
          <label>Jogador antigo</label>
          <select id="claimSelect">
            ${orphans.map(op => `<option value="${op.id}">${op.name}</option>`).join('')}
          </select>
        </div>
      </div>
      <button class="danger" id="claimBtn" type="button" style="margin-top:10px;">Transferir histórico pra minha conta</button>
    </div>
  ` : '';

  return `
    <div class="panel accent-blue">
      <h2>Meu Perfil <span class="sub">${p.name} · ${MODES[viewMode].label}</span></h2>
      ${rankBlock}${regionBlockHTML(p)}
      ${pendingOwn > 0 ? `<div class="helper-note">Você tem ${pendingOwn} partida(s) de ${MODES[viewMode].label} aguardando aprovação.</div>` : ''}
      <div class="stat-cards">${cards.join('')}</div>
    </div>
    ${claimBlock}
  `;
}

function historicoHTML(){
  const isMod = !!(userProfile && userProfile.role === 'moderator');
  const pid = (isMod && histPlayerId && players.some(x => x.id === histPlayerId)) ? histPlayerId : currentPlayerId;
  const p = players.find(p => p.id === pid);
  const modPick = isMod ? `<div class="region-row"><label for="histPlayer">Ver histórico de</label><select id="histPlayer">${[...players].sort((a,b) => String(a.name).localeCompare(String(b.name))).map(x => `<option value="${x.id}" ${x.id === pid ? 'selected' : ''}>${x.name}</option>`).join('')}</select></div>` : '';
  if(!p) return `<div class="panel accent-muted"><p class="empty-note">Selecione um jogador para ver o histórico.</p></div>`;
  const cfg = MODES[viewMode];
  const s = computeModeStats(p.id, viewMode);
  const all = matches.filter(m => m.playerId === p.id && (m.mode||'competitivo') === viewMode).sort((a,b) => b.createdAt - a.createdAt);
  if(all.length === 0) return `<div class="panel accent-muted"><h2>Histórico <span class="sub">${p.name} · ${cfg.label}</span></h2>${modPick}<p class="empty-note">Nenhuma partida registrada neste modo ainda.</p></div>`;

  const rows = all.map(m => {
    const approved = s.historyMap[m.id];
    const deltaCell = cfg.hasPatente
      ? (approved ? `<span class="${approved.eloDelta>=0?'win':'loss'}">${approved.eloDelta>=0?'+':''}${approved.eloDelta}</span>` : `<span class="status-badge status-${m.status}">${m.status}</span>`)
      : `<span class="status-badge status-${m.status}">${m.status}</span>`;
    return `
      <tr>
        <td>${m.date}</td>
        <td>${m.map}</td>
        ${cfg.hasResultado ? `<td class="${m.result==='vitoria'?'win':m.result==='derrota'?'loss':'draw'}">${m.result==='vitoria'?'Vitória':m.result==='derrota'?'Derrota':'Empate'}</td>` : ''}
        <td>${m.kills}/${m.deaths}${cfg.fields.includes('assists') ? '/'+(m.assists||0) : ''}</td>
        <td>${m.pontos||0}</td>
        ${cfg.fields.includes('mvps') ? `<td class="stars">${starString(m.mvps||0)}</td>` : ''}
        <td>${deltaCell}${m.correctedByAI ? '<span class="ai-tag">🤖 ajustado</span>' : ''}</td>
        ${isMod ? `<td>${m.status === 'aprovada' ? `<button class="danger small" data-remove-match="${m.id}" title="Remover partida do histórico">Remover</button>` : ''}</td>` : ''}
      </tr>
    `;
  }).join('');

  return `
    <div class="panel accent-muted">
      <h2>Histórico <span class="sub">${p.name} · ${cfg.label}</span></h2>
      ${modPick}
      <table>
        <thead><tr>
          <th>Data</th><th>Mapa</th>
          ${cfg.hasResultado ? '<th>Resultado</th>' : ''}
          <th>K/D${cfg.fields.includes('assists')?'/A':''}</th><th>Pontos</th>
          ${cfg.fields.includes('mvps') ? '<th>MVPs</th>' : ''}
          <th>Status / Δ Elo</th>${isMod ? '<th>Ação</th>' : ''}
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

function rankingHTML(){
  const cfg = MODES[viewMode];
  const approvedCount = matches.filter(m => m.status === 'aprovada' && (m.mode||'competitivo') === viewMode).length;
  const pendingCount = matches.filter(m => m.status === 'pendente' && (m.mode||'competitivo') === viewMode).length;

  if(!cfg.rankBy){
    return `<div class="panel"><h2>Ranking <span class="sub">${cfg.label}</span></h2><p class="empty-note">${cfg.label} é um modo livre, sem ranking oficial — as partidas ficam registradas só no histórico de cada jogador.</p></div>`;
  }

  const chIds = cfg.rankBy === 'elo' ? challengerIds(viewMode) : new Set();
  const ranked = getModeRanking(viewMode).filter(r => rankRegion === 'all' || r.p.region === rankRegion);
  const leader = ranked[0];
  const regionChips = `<div class="mode-chips"><div class="mode-chip ${rankRegion==='all'?'active':''}" data-region="all">Todas as regiões</div>${REGIONS.map(r => `<div class="mode-chip ${rankRegion===r?'active':''}" data-region="${r}">${regionLabel(r)}</div>`).join('')}</div>`;
  const chList = cfg.rankBy === 'elo' ? (() => {
    const list = ranked.filter(r => chIds.has(r.p.id));
    return `<div class="challenger-box"><div class="challenger-head">${challengerSVG(34)}<div><b>Challenger</b><span>Os melhores de cada região · Nível 10 + Top ${CHALLENGER_SLOTS}</span></div></div>${list.length ? `<div class="challenger-list">${list.map(r => `<span class="challenger-chip">${r.p.name}<i>${r.p.region}</i></span>`).join('')}</div>` : `<p class="empty-note">Ninguém alcançou o Challenger ainda — chegue ao Nível 10 (2001+ ELO) e fique entre os ${CHALLENGER_SLOTS} melhores da sua região.</p>`}</div>`;
  })() : '';

  const hero = `
    <div class="hero-stats">
      <div class="hero-card"><div class="val">${ranked.length}</div><div class="lbl">Jogadores Ranqueados</div></div>
      <div class="hero-card"><div class="val">${approvedCount}</div><div class="lbl">Partidas Aprovadas</div></div>
      <div class="hero-card"><div class="val">${pendingCount}</div><div class="lbl">Em Análise</div></div>
      <div class="hero-card"><div class="val" style="font-size:16px;">${leader ? leader.p.name : '—'}</div><div class="lbl">Líder Atual</div></div>
    </div>
  `;

  if(ranked.length === 0) return `<div class="panel"><h2>Ranking <span class="sub">${cfg.label}</span></h2>${regionChips}${hero}${chList}<p class="empty-note">Nenhum jogador com partidas aprovadas neste modo ainda.</p></div>`;

  const rows = ranked.map((r, i) => {
    let metricCols;
    if(cfg.rankBy === 'elo'){
      const badge = r.s.calibrating
        ? `<span class="mini-badge" style="background:var(--panel2); color:var(--muted); border:1px dashed var(--line);">?</span>`
        : (() => { const t = playerTier(r.p, r.s, viewMode, chIds); return `<span class="mini-badge" style="background:none">${tierIconSVG(t, 28)}</span>`; })();
      const tierName = r.s.calibrating ? `Calibrando (${r.s.total}/10)` : playerTier(r.p, r.s, viewMode, chIds).name;
      metricCols = `<td class="name-cell">${badge}${r.p.name}</td><td>${tierName}</td><td>${r.s.elo}</td><td>${r.p.region || '—'}</td><td>${r.s.total}</td><td>${r.s.winRate.toFixed(0)}%</td>`;
    } else if(cfg.rankBy === 'winRate'){
      metricCols = `<td class="name-cell">${r.p.name}</td><td>${r.s.winRate.toFixed(0)}%</td><td>${r.s.total}</td><td>${r.s.kills}</td><td>${r.s.pontos}</td>`;
    } else {
      metricCols = `<td class="name-cell">${r.p.name}</td><td>${r.s.kills}</td><td>${r.s.total}</td><td>${r.s.kd.toFixed(2)}</td><td>${r.s.pontos}</td>`;
    }
    return `<tr><td class="pos">${i+1}</td>${metricCols}</tr>`;
  }).join('');

  let headCols;
  if(cfg.rankBy === 'elo') headCols = '<th>Jogador</th><th>Nível</th><th>Elo</th><th>Região</th><th>Partidas</th><th>Vitória %</th>';
  else if(cfg.rankBy === 'winRate') headCols = '<th>Jogador</th><th>Vitória %</th><th>Partidas</th><th>Kills</th><th>Pontos</th>';
  else headCols = '<th>Jogador</th><th>Kills Totais</th><th>Partidas</th><th>K/D</th><th>Pontos</th>';

  return `
    <div class="panel">
      <h2>Ranking <span class="sub">${cfg.label} · Comunidade BRCS2</span></h2>
      ${regionChips}
      ${hero}
      ${chList}
      <table>
        <thead><tr><th>#</th>${headCols}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

function moderacaoHTML(){
  if(!userProfile || userProfile.role !== 'moderator'){
    return `<div class="panel accent-red"><h2>Moderação</h2><p class="empty-note">Acesso restrito à equipe do BRCS2.</p></div>`;
  }
  const pending = matches.filter(m => m.status === 'pendente').sort((a,b) => a.createdAt - b.createdAt);
  if(pending.length === 0) return `<div class="panel accent-red"><h2>Moderação</h2><p class="empty-note">Nenhuma partida aguardando análise.</p></div>`;

  const cards = pending.map(m => {
    const player = players.find(p => p.id === m.playerId);
    const flags = flagsFor(m);
    const cfg = MODES[m.mode || 'competitivo'];
    return `
      <div class="mod-card">
        <img class="mod-proof" id="proof-${m.id}" alt="print do placar">
        <div class="mod-body">
          <div class="name-cell">${player ? player.name : '—'} <span class="mode-tag">${cfg.label}</span> <span class="mono" style="color:var(--muted); font-weight:400;">· ${m.map} · ${m.date}</span></div>
          <div style="margin-top:4px;">
            ${cfg.hasResultado ? `Resultado: <b class="${m.result==='vitoria'?'win':m.result==='derrota'?'loss':'draw'}">${m.result}</b> — ` : ''}
            K/D${cfg.fields.includes('assists')?'/A':''} ${m.kills}/${m.deaths}${cfg.fields.includes('assists') ? '/'+(m.assists||0) : ''} — Pontos ${m.pontos||0}${cfg.fields.includes('mvps') ? ' — MVPs '+(m.mvps||0) : ''}
          </div>
          ${m.aiNote ? `<div class="mod-ai">🤖 ${m.aiNote}</div>` : ''}
          ${flags.length ? `<div class="mod-flags">⚠ ${flags.join(' · ')}</div>` : ''}
        </div>
        <div class="mod-actions">
          <button class="ok small" data-approve="${m.id}">Aprovar</button>
          <button class="danger small" data-reject="${m.id}">Rejeitar</button>
          <a class="download-link" id="dl-${m.id}" href="#" download="brcsgo-print-${m.id}.jpg">Baixar imagem</a>
        </div>
      </div>
    `;
  }).join('');

  return `
    <div class="panel accent-red">
      <h2>Moderação <span class="sub">${pending.length} partida(s) aguardando análise</span></h2>
      ${cards}
    </div>
  `;
}


// =============== EVENTOS / CAMPEONATOS ===============
const STAGE_DEFS = [
  // Cada etapa alimenta a próxima em cadeia sequencial (single-elimination)
  { key:'openGroup',   label:'Open Group',      type:'group', advance:64 },   // 120 jogadores  -> 64 classificam
  { key:'closedGroup', label:'Closed Group',    type:'group', advance:32 },   //  64 jogadores  -> 32 classificam
  { key:'qualifier',   label:'Qualificatórias', type:'group', advance:32 },   //  32 jogadores  -> 32 avançam (seeding)
  { key:'r32',         label:'16 avos',         type:'elim',  slots:32 },     //  32 times (16 partidas) -> 16 vencedores
  { key:'r16',         label:'8 avos',          type:'elim',  slots:16 },     //  16 times ( 8 partidas) ->  8 vencedores
  { key:'quarters',    label:'Quartas de Final',type:'elim',  slots:8  },     //   8 times ( 4 partidas) ->  4 vencedores
  { key:'semis',       label:'Semifinal',       type:'elim',  slots:4  },     //   4 times ( 2 partidas) ->  2 finalistas
  { key:'final',       label:'Final',           type:'elim',  slots:2  }      //   2 times ( 1 partida ) ->  campeão
];

function newEventDraft(){
  return {
    name:'', sigla:'', description:'', reward:'', startDate:'',
    teamsRaw:'',
    format: { openGroup:false, closedGroup:false, qualifier:false, r32:false, r16:false, quarters:true, semis:true, final:true }
  };
}

function parseTeamsList(raw){
  return (raw||'').split(/\n|,|;/).map(s => s.trim()).filter(Boolean).map((n,i) => ({
    id: 't_' + Date.now().toString(36) + '_' + i,
    name: n,
    seed: i+1
  }));
}

function buildStagesFromFormat(format, teams){
  const active = STAGE_DEFS.filter(sd => format[sd.key]);
  if(active.length === 0) return [];
  const stages = [];
  let currentTeams = teams.map(t => t.id);
  active.forEach((sd, idx) => {
    const stage = {
      key: sd.key, label: sd.label, type: sd.type,
      teams: currentTeams.slice(),
      matches: [],
      advanceCount: null,
      completed: false
    };
    if(sd.type === 'group'){
      // round-robin: each pair plays once
      const ts = currentTeams.slice();
      for(let i=0; i<ts.length; i++){
        for(let j=i+1; j<ts.length; j++){
          stage.matches.push({
            id:'gm_'+idx+'_'+i+'_'+j, a: ts[i], b: ts[j],
            scoreA:null, scoreB:null, winner:null
          });
        }
      }
      // default advance = min(next stage slots, half of teams)
      const next = active[idx+1];
      stage.advanceCount = next && next.slots ? Math.min(next.slots, ts.length) : Math.max(1, Math.floor(ts.length/2));
    } else {
      // elim: pair 1v N, 2v N-1, ...
      const ts = currentTeams.slice();
      // pad with BYE if odd
      while(ts.length % 2 !== 0) ts.push('__BYE__');
      const half = ts.length / 2;
      for(let i=0; i<half; i++){
        stage.matches.push({
          id:'em_'+idx+'_'+i, a: ts[i], b: ts[ts.length-1-i],
          scoreA:null, scoreB:null, winner: null
        });
      }
    }
    stages.push(stage);
    // For next stage seeding, we pre-fill with placeholders (TBD) — actual advancement happens via advanceStage()
    currentTeams = new Array( sd.type==='group' ? stage.advanceCount : Math.max(1, Math.floor(stage.matches.length)) ).fill('__TBD__');
  });
  return stages;
}

function teamName(ev, tid){
  if(tid === '__BYE__') return '(bye)';
  if(tid === '__TBD__' || !tid) return 'A definir';
  const t = ev.teams.find(x => x.id === tid);
  return t ? t.name : tid;
}
function teamSeed(ev, tid){
  const t = ev.teams.find(x => x.id === tid);
  return t ? t.seed : '';
}

function stageIsComplete(stage){
  if(stage.type === 'elim'){
    return stage.matches.every(m => m.winner || m.a==='__BYE__' || m.b==='__BYE__');
  }
  return stage.matches.every(m => m.winner);
}

function computeGroupStandings(stage, ev){
  const stats = {};
  stage.teams.forEach(tid => { stats[tid] = { tid, name: teamName(ev,tid), w:0, l:0, d:0, gf:0, ga:0, played:0 }; });
  stage.matches.forEach(m => {
    if(m.winner){
      stats[m.a].played++; stats[m.b].played++;
      stats[m.a].gf += m.scoreA||0; stats[m.a].ga += m.scoreB||0;
      stats[m.b].gf += m.scoreB||0; stats[m.b].ga += m.scoreA||0;
      if(m.winner === 'a'){ stats[m.a].w++; stats[m.b].l++; }
      else if(m.winner === 'b'){ stats[m.b].w++; stats[m.a].l++; }
      else { stats[m.a].d++; stats[m.b].d++; }
    }
  });
  return Object.values(stats).sort((x,y) => (y.w - x.w) || ((y.gf-y.ga)-(x.gf-x.ga)) || (y.gf - x.gf));
}

function advanceStage(ev, stageIdx){
  const stage = ev.stages[stageIdx];
  if(!stage || !stageIsComplete(stage)) return;
  const next = ev.stages[stageIdx+1];
  stage.completed = true;
  let advanced = [];
  if(stage.type === 'group'){
    const standings = computeGroupStandings(stage, ev);
    advanced = standings.slice(0, stage.advanceCount || standings.length).map(s => s.tid);
  } else {
    advanced = stage.matches.map(m => {
      if(m.a === '__BYE__') return m.b;
      if(m.b === '__BYE__') return m.a;
      return m.winner === 'a' ? m.a : m.b;
    });
  }
  if(next){
    if(next.type === 'elim'){
      let ts = advanced.slice();
      while(ts.length % 2 !== 0) ts.push('__BYE__');
      next.teams = ts;
      next.matches = [];
      const half = ts.length/2;
      for(let i=0; i<half; i++){
        next.matches.push({
          id:'em_a'+stageIdx+'_'+i, a: ts[i], b: ts[ts.length-1-i],
          scoreA:null, scoreB:null, winner:null
        });
      }
    } else {
      next.teams = advanced.slice();
      next.matches = [];
      for(let i=0; i<advanced.length; i++){
        for(let j=i+1; j<advanced.length; j++){
          next.matches.push({ id:'gm_a'+stageIdx+'_'+i+'_'+j, a:advanced[i], b:advanced[j], scoreA:null, scoreB:null, winner:null });
        }
      }
    }
  } else {
    // finished the whole thing
    if(stage.type === 'elim' && stage.key === 'final'){
      const finalM = stage.matches[0];
      if(finalM && finalM.winner){
        ev.winner = finalM.winner === 'a' ? finalM.a : finalM.b;
      }
    }
    ev.status = 'finished';
  }
}

function eventStatusLabel(ev){
  if(ev.status === 'finished') return 'Encerrado';
  if(ev.status === 'live') return 'Ao vivo';
  return 'Em breve';
}

function eventsSortedActive(){
  const order = { live:0, upcoming:1, finished:2 };
  return events.slice().sort((a,b) => (order[a.status]||9) - (order[b.status]||9) || (b.createdAt||0) - (a.createdAt||0));
}

}

function eventDetailHTML(ev){
  const isMod = userProfile && userProfile.role === 'moderator';
  const stages = ev.stages || [];
  if(eventDetailStage >= stages.length) eventDetailStage = 0;

  let stageBody = '<p class="empty-note">Sem fases configuradas.</p>';
  if(stage){

      stageBody = `

  const podium = (ev.status === 'finished' && stages.length) ? renderPodium(ev) : '';

  return `

      <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:14px; flex-wrap:wrap;">

            <span>🎯 <b>${stages.length}</b> fases</span>
            ${ev.startDate ? `<span>📅 <b>${ev.startDate}</b></span>` : ''}

    </div>
    ${podium}
  `;
}

function renderElimMatch(ev, stage, m, isMod){
  const winnerA = m.winner === 'a';
  const winnerB = m.winner === 'b';
  const decided = m.winner || m.a==='__BYE__' || m.b==='__BYE__';
  return `
    <div class="bracket-match" data-match-id="${m.id}">
      <div class="bm-row ${winnerA?'winner':(decided?'loser':'')}">
        <div class="bm-team"><span class="seed">${teamSeed(ev,m.a)||''}</span><span class="nm">${teamName(ev,m.a)}</span></div>
        ${isMod && m.a!=='__BYE__' && m.b!=='__BYE__' && m.a!=='__TBD__' && m.b!=='__TBD__'
          ? `<input class="score-inp" data-mid="${m.id}" data-side="a" type="number" min="0" value="${m.scoreA??''}" placeholder="0">`
          : `<div class="bm-score">${m.scoreA??'-'}</div>`}
      </div>
      <div class="bm-row ${winnerB?'winner':(decided?'loser':'')}">
        <div class="bm-team"><span class="seed">${teamSeed(ev,m.b)||''}</span><span class="nm">${teamName(ev,m.b)}</span></div>
        ${isMod && m.a!=='__BYE__' && m.b!=='__BYE__' && m.a!=='__TBD__' && m.b!=='__TBD__'
          ? `<input class="score-inp" data-mid="${m.id}" data-side="b" type="number" min="0" value="${m.scoreB??''}" placeholder="0">`
          : `<div class="bm-score">${m.scoreB??'-'}</div>`}
      </div>
      ${isMod && m.a!=='__BYE__' && m.b!=='__BYE__' && m.a!=='__TBD__' && m.b!=='__TBD__' ? `
        <div class="bm-actions">
          <button class="ok small" data-set-winner="${m.id}" data-side="a">Vence A</button>
          <button class="ok small" data-set-winner="${m.id}" data-side="b">Vence B</button>
          ${m.winner ? `<button class="secondary small" data-clear-winner="${m.id}">Limpar</button>` : ''}
        </div>` : ''}
    </div>
  `;
}

function renderGroupMatch(ev, stage, m, isMod){
  return `
    <div class="gm-row" data-match-id="${m.id}">
      <div class="gm-teams">
        <span class="tm">${teamName(ev,m.a)}</span>
        <span class="vs">vs</span>
        <span class="tm">${teamName(ev,m.b)}</span>
        ${(!isMod && (m.scoreA!=null || m.scoreB!=null)) ? `<span class="sc">${m.scoreA??'-'} × ${m.scoreB??'-'}</span>` : ''}
      </div>
      ${isMod ? `
        <div class="gm-controls">
          <input class="score-inp" data-mid="${m.id}" data-side="a" type="number" min="0" value="${m.scoreA??''}" placeholder="A">
          <span class="mid">×</span>
          <input class="score-inp" data-mid="${m.id}" data-side="b" type="number" min="0" value="${m.scoreB??''}" placeholder="B">
          <button class="ok small" data-set-winner="${m.id}" data-side="a">A</button>
          <button class="ok small" data-set-winner="${m.id}" data-side="b">B</button>
          <button class="secondary small" data-set-winner="${m.id}" data-side="d">Empate</button>
        </div>
      ` : ''}
    </div>
  `;
}

function renderPodium(ev){
  const finalStage = ev.stages[ev.stages.length-1];
  if(!finalStage || finalStage.type !== 'elim' || !finalStage.matches[0]) return '';
  const fm = finalStage.matches[0];
  const first = fm.winner === 'a' ? fm.a : fm.b;
  const second = fm.winner === 'a' ? fm.b : fm.a;
  // third: from semis stage if exists
  let third = null;
  const semis = ev.stages.find(s => s.key === 'semis');
  if(semis){
    const losers = semis.matches.map(m => m.winner === 'a' ? m.b : m.a).filter(t => t !== first && t !== second);
    third = losers[0];
  }
  return `
    <div class="panel accent-blue">
      <h2>Pódio 🏆</h2>
      <div class="podium">
        <div class="pd second"><div class="pos">2º</div><div class="nm">${teamName(ev, second)}</div></div>
        <div class="pd first"><div class="pos">1º</div><div class="nm">${teamName(ev, first)}</div></div>
        <div class="pd third"><div class="pos">3º</div><div class="nm">${third ? teamName(ev, third) : '—'}</div></div>
      </div>
    </div>
  `;
}
